<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1310">
<link rel="icon" href="icon-192.png?v=1"><link rel="apple-touch-icon" href="icon-192.png?v=1">
<title>Minha área · Xis da Gaúcha</title>
<style>
:root{--bg:#f3f4f2;--ink:#121614;--mut:#66706a;--line:#e3e6e2;--acc:#1f8a4c;--wa:#25d366;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{background:#0e1310;color:#fff;padding:18px 18px 22px}.top small{color:#9fb3a6;display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.top h1{margin:4px 0 0;font-size:22px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 50px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.big{font-size:34px;font-weight:800}.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#eef0ee}.ok{background:#e4f4ea;color:var(--acc)}.bad{background:#fdecec;color:var(--bad)}.warn{background:#fff4dc;color:#a86b00}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid #cfd5d1;border-radius:10px;margin:6px 0 12px}
label{font-size:13px;font-weight:700;color:var(--mut)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;width:100%;background:var(--acc);color:#fff;cursor:pointer}button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:20px}
.tabs{display:flex;gap:6px}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:8px;font-size:14px}.tabs button.on{background:var(--ink);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 b{display:block;font-size:22px}
</style></head><body>
<div class="top"><small>Xis da Gaúcha</small><h1>Minha área</h1></div>
<div class="wrap" id="app"><div class="card mut">Carregando…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const DOM = 'funcionarios.xisdagaucha.com.br';
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesTxt = m => { const [y, n] = m.split('-'); return MESES[+n - 1] + ' de ' + y; };
const fmtH = h => { h = +h || 0; let H = Math.floor(h), M = Math.round((h - H) * 60); if (M === 60) { H++; M = 0; } return H + ':' + String(M).padStart(2, '0'); };
const dt = t => { const d = new Date(t); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
const dataBr = s => s ? s.split('-').reverse().join('/') : '–';
let db, user, doc = null, aba = 'resumo';
if (!window.FIREBASE_CONFIG) { app.innerHTML = '<div class="card">O sistema ainda não foi configurado.</div>'; }
else {
  firebase.initializeApp(window.FIREBASE_CONFIG); db = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => { user = u; if (!u) return login(); await carregar(); });
}
function login(msg) {
  app.innerHTML = `<div class="card"><h2>Entrar</h2><label>CPF (só números)</label><input id="cpf" inputmode="numeric" autocomplete="username" maxlength="14"><label>Senha</label><input id="pw" type="password" inputmode="numeric" autocomplete="current-password"><p class="small mut" style="margin:-4px 0 12px">No primeiro acesso, a senha é a sua data de nascimento (DDMMAAAA). Ex.: 05031998</p><div class="err" id="er">${esc(msg || '')}</div><button id="go">Entrar</button></div><p class="small mut" style="text-align:center">Esqueceu a senha? Fale com a gestão.</p>`;
  const go = async () => {
    const cpf = $('#cpf').value.replace(/\D/g, ''), pw = $('#pw').value.trim();
    if (cpf.length !== 11) return $('#er').textContent = 'Digite os 11 números do CPF.';
    $('#go').disabled = true; $('#er').textContent = '';
    try { await firebase.auth().signInWithEmailAndPassword(cpf + '@' + DOM, pw); }
    catch (e) { $('#go').disabled = false; $('#er').textContent = /too-many/.test(e.code) ? 'Muitas tentativas. Espere alguns minutos.' : 'CPF ou senha incorretos.'; }
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function carregar() {
  try { const s = await db.collection('portal').doc(user.uid).get(); doc = s.exists ? s.data() : null; }
  catch (e) { doc = null; }
  if (!doc) { app.innerHTML = `<div class="card">Seu acesso ainda está sendo preparado pela gestão. Tente de novo mais tarde.</div><button class="sec" onclick="firebase.auth().signOut()">Sair</button>`; return; }
  if (doc.ativo === false) { app.innerHTML = `<div class="card">Este acesso foi encerrado.</div><button class="sec" onclick="firebase.auth().signOut()">Sair</button>`; return; }
  if (!doc.senhaTrocadaEm) return novaSenha();
  tela();
}
function novaSenha() {
  app.innerHTML = `<div class="card"><h2>Crie sua senha</h2><p style="margin-top:0">Olá, <b>${esc(doc.nome.split(' ')[0])}</b>! Para proteger seus dados, crie uma senha só sua, com pelo menos 6 números.</p><label>Nova senha</label><input id="n1" type="password" inputmode="numeric" autocomplete="new-password"><label>Repita a senha</label><input id="n2" type="password" inputmode="numeric" autocomplete="new-password"><div class="err" id="er"></div><button id="ok">Salvar senha</button></div>`;
  $('#ok').onclick = async () => {
    const a = $('#n1').value.trim(), b = $('#n2').value.trim();
    if (a.length < 6) return $('#er').textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    if (a !== b) return $('#er').textContent = 'As senhas não são iguais.';
    $('#ok').disabled = true;
    try { await user.updatePassword(a); await db.collection('portal').doc(user.uid).update({ senhaTrocadaEm: Date.now() }); doc.senhaTrocadaEm = Date.now(); tela(); }
    catch (e) { $('#ok').disabled = false; $('#er').textContent = 'Não consegui salvar: ' + (e.code || e.message); }
  };
}
function tela() {
  const c = (doc.consumo || []), atual = c[0], ant = c[1], v = doc.voucher, p = (doc.ponto || [])[0];
  const itens = l => (l || []).map(x => `<div class="row"><span><span class="mut small">${dt(x.at)}</span> ${esc(x.desc)}${x.voucher ? `<br><span class="small mut">voucher ${brl(x.voucher)}</span>` : ''}</span><span style="text-align:right;white-space:nowrap"><b>${brl(x.adiant ? x.total : x.aDescontar || x.total)}</b><br>${x.sit ? `<span class="pill ${x.sit === 'a descontar' ? 'warn' : 'ok'}">${esc(x.sit)}</span>` : ''}</span></div>`).join('') || '<p class="mut small" style="margin:0">Nada lançado.</p>';
  let body = '';
  if (aba === 'resumo') body = `
    ${v ? `<div class="card"><h2>Meu voucher</h2><div class="big">${brl(v.saldo)}</div><span class="mut small">saldo para usar em consumo</span></div>` : ''}
    ${atual ? `<div class="card"><h2>Consumo de ${mesTxt(atual.mes)}</h2><div class="big">${brl(atual.aDescontar)}</div><span class="mut small">a descontar${atual.voucherUsado ? ` · ${brl(atual.voucherUsado)} pagos com voucher` : ''}</span><div style="margin-top:10px">${itens(atual.itens)}</div></div>` : ''}
    ${p ? `<div class="card"><h2>Ponto de ${mesTxt(p.mes)}</h2><div class="g3"><div><b>${fmtH(p.extras)}</b><span class="small mut">horas extras</span></div><div><b>${fmtH(p.faltantes)}</b><span class="small mut">horas faltantes</span></div><div><b>${(p.faltasInj || 0) + (p.faltasJust || 0)}</b><span class="small mut">faltas</span></div></div>${p.extrasValor ? `<p class="small" style="margin:10px 0 0">Valor das horas extras: <b>${brl(p.extrasValor)}</b></p>` : ''}${p.voucher != null ? `<p style="margin:10px 0 0">${p.voucher ? '<span class="pill ok">Sem atraso e sem falta: tem direito ao voucher 🎉</span>' : '<span class="pill bad">Teve atraso ou falta neste mês</span>'}</p>` : ''}${p.obs ? `<p class="small mut" style="margin:8px 0 0">${esc(p.obs)}</p>` : ''}</div>` : ''}`;
  if (aba === 'consumo') body = (c.length ? c : []).map(m => `<div class="card"><h2>${mesTxt(m.mes)}</h2><div class="row"><span>A descontar</span><b>${brl(m.aDescontar)}</b></div><div class="row"><span>Pago com voucher</span><b>${brl(m.voucherUsado)}</b></div><div style="margin-top:8px">${itens(m.itens)}</div></div>`).join('') + (v && v.itens && v.itens.length ? `<div class="card"><h2>Meus vouchers</h2>${v.itens.map(x => `<div class="row"><span>${esc(x.motivo || 'Voucher')}<br><span class="small mut">recebido em ${dt(x.at)} · ${brl(x.valor)}</span></span><b>${brl(x.saldo)}</b></div>`).join('')}</div>` : '') || '<div class="card mut">Nada por aqui ainda.</div>';
  if (aba === 'ponto') body = (doc.ponto || []).map(x => `<div class="card"><h2>${mesTxt(x.mes)}</h2><div class="row"><span>Horas extras</span><b>${fmtH(x.extras)}${x.extrasValor ? ' · ' + brl(x.extrasValor) : ''}</b></div><div class="row"><span>Horas faltantes</span><b>${fmtH(x.faltantes)}</b></div><div class="row"><span>Faltas sem justificativa</span><b>${x.faltasInj || 0}</b></div><div class="row"><span>Faltas com atestado</span><b>${x.faltasJust || 0}</b></div>${x.obs ? `<p class="small mut" style="margin:8px 0 0">${esc(x.obs)}</p>` : ''}</div>`).join('') || '<div class="card mut">O ponto ainda não foi lançado.</div>';
  if (aba === 'dados') body = `<div class="card"><h2>Meus dados</h2><div class="row"><span>Cargo</span><b>${esc(doc.cargo)}</b></div><div class="row"><span>Loja</span><b>${esc(doc.loja)}</b></div><div class="row"><span>Entrada</span><b>${dataBr(doc.admissao)}</b></div><div class="row"><span>Tempo de casa</span><b>${esc(doc.tempo)}</b></div>${doc.contrato ? `<div class="row"><span>Contrato</span><b>${esc(doc.contrato)}</b></div>` : ''}${doc.aniversario ? `<div class="row"><span>Aniversário</span><b>${esc(doc.aniversario)}</b></div>` : ''}</div>
    <div class="card"><h2>Uniformes comigo</h2>${(doc.uniformes || []).map(u => `<div class="row"><span>${esc(u)}</span></div>`).join('') || '<p class="mut small" style="margin:0">Nenhum.</p>'}</div>`;
  app.innerHTML = `<div class="card" style="padding:12px 16px"><b>Olá, ${esc(doc.nome.split(' ')[0])}!</b><br><span class="small mut">Atualizado em ${new Date(doc.atualizado || Date.now()).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span></div>
    <div class="tabs">${[['resumo', 'Resumo'], ['consumo', 'Consumo'], ['ponto', 'Ponto'], ['dados', 'Meus dados']].map(([k, t]) => `<button data-t="${k}" class="${aba === k ? 'on' : ''}">${t}</button>`).join('')}</div>${body}
    <button class="sec" id="sair">Sair</button>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { aba = b.dataset.t; tela(); });
  $('#sair').onclick = () => firebase.auth().signOut();
}
</script></body></html>
