<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png?v=1"><link rel="apple-touch-icon" href="icon-192.png?v=1">

<title>Minha área · Xis da Gaúcha</title>
<style>
:root{--preto:#000;--cartao:#121512;--cartao2:#171b17;--linha:#1f2a21;--verde:#28c850;--verde2:#1e9e3e;--branco:#fff;--cinza:#a3ada5;--bad:#ff6b6b;--warn:#ffc04d}
*{box-sizing:border-box}
html,body{background:var(--preto)}
body{margin:0;color:var(--branco);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
  background:radial-gradient(560px 340px at 50% -60px,rgba(40,200,80,.22),transparent 70%),var(--preto)}
.top{text-align:center;padding:calc(22px + env(safe-area-inset-top)) 16px 6px}
.top img{width:min(190px,56vw);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.top .tt{margin-top:10px;font-family:"Archivo Black",sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.top .tt span{color:var(--verde)}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 50px;display:flex;flex-direction:column;gap:12px}
.card{position:relative;background:var(--cartao);border:1px solid var(--linha);border-radius:18px;padding:18px 18px 16px;overflow:hidden}
.card.dest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--verde)}
.card h2{margin:0 0 8px;font-size:12px;color:var(--cinza);font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.big{font-family:"Archivo Black",sans-serif;font-size:36px;line-height:1.1;letter-spacing:.01em}
.big.verde{color:var(--verde)}
.mut{color:var(--cinza)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}.row:last-child{border:0}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;background:#1d231e;color:#dfe5e0}
.ok{background:rgba(40,200,80,.14);color:var(--verde)}.bad{background:rgba(255,90,90,.14);color:var(--bad)}.warn{background:rgba(255,192,77,.14);color:var(--warn)}
input{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid #2e3a31;background:#0b0d0b;color:var(--branco);border-radius:12px;margin:6px 0 12px}
input:focus{outline:2px solid var(--verde2);border-color:var(--verde2)}
label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
button{font:inherit;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px;border:0;border-radius:14px;padding:15px;width:100%;background:var(--verde);color:var(--preto);cursor:pointer}
button:active{transform:scale(.98)}
button.sec{background:transparent;color:var(--branco);border:2px solid var(--linha);text-transform:none;letter-spacing:0}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:20px}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{background:var(--cartao);color:var(--cinza);border:1px solid var(--linha);padding:10px 8px;font-size:12px;letter-spacing:.08em;flex:1;white-space:nowrap;border-radius:12px}
.tabs button.on{background:var(--verde);color:var(--preto);border-color:var(--verde)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 b{display:block;font-family:"Archivo Black",sans-serif;font-size:22px}
.ola{display:flex;align-items:center;gap:12px}.ola .av{width:46px;height:46px;border-radius:50%;background:rgba(40,200,80,.14);color:var(--verde);display:grid;place-items:center;font-family:"Archivo Black",sans-serif;font-size:18px;flex:none}
.ola b{font-size:18px}
footer{text-align:center;margin-top:10px;font-size:11px;color:#5f6b62;letter-spacing:.14em;text-transform:uppercase}footer b{color:var(--verde)}
</style></head><body>
