<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1310"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="ponto.webmanifest?v=1"><link rel="icon" href="icon-192.png?v=1"><link rel="apple-touch-icon" href="icon-192.png?v=1">
<title>Ponto X · Xis da Gaúcha</title>
<style>
:root{--bg:#000;--card:#121512;--card2:#1a1f1a;--ink:#f2f5f3;--mut:#93a199;--line:#1f2a21;--acc:#28c850;--acc2:#1e9e3e;--bad:#ff5a5a;--warn:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(620px 360px at 50% -80px,rgba(40,200,80,.18),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:12px;background:#000;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.logo{height:58px;width:auto;flex:none}
.p{border-left:4px solid var(--acc)}
.volta{display:inline-block;margin-top:2px;font-size:13px;font-weight:800;color:#05200f;background:var(--warn);border-radius:20px;padding:2px 10px}.volta.atr{background:var(--bad);color:#fff}
.voltab{background:#2b2206;border:2px solid var(--warn);border-radius:16px;padding:12px 16px;text-align:center;color:#ffe2a3}.voltab b{display:block;font-size:46px;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.ok .tipo{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mark svg{width:28px;height:28px}
.brand b{display:block;font-size:20px;letter-spacing:.01em}.brand small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.grow{flex:1}
.gear{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.gear svg{width:22px;height:22px}
.clock{text-align:center;margin:18px 0 6px}
.clock .h{font-size:clamp(56px,13vw,108px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--mut);font-size:18px;margin-top:6px}
.hint{text-align:center;color:var(--mut);margin:8px 0 18px;font-size:17px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.net i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}.net.off i{background:var(--bad)}.net.off{color:var(--bad)}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;min-height:132px;justify-content:center;text-align:center;transition:transform .08s}
.p:active{transform:scale(.97);background:var(--card2)}
.av{width:58px;height:58px;border-radius:50%;background:rgba(40,200,80,.14);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:22px}
.p b{font-size:18px;line-height:1.2}.p small{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.box h2{margin:0;font-size:22px;text-align:center}
.box p{margin:0;text-align:center;color:var(--mut)}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.dots.err{animation:shake .35s}.dots.err i{border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:68px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:28px;font-weight:700;cursor:pointer}
.pad button:active{background:#2c3a32}
.pad .sm{font-size:16px;font-weight:600;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;font-size:17px;text-align:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#05200f}
.btn.ghost{background:none}
.input{width:100%;border:1px solid var(--line);background:#0b0f0d;border-radius:12px;padding:14px;font-size:17px;user-select:text;-webkit-user-select:text}
.input:focus{outline:2px solid var(--acc2)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.err{color:var(--bad);text-align:center;font-size:15px;min-height:1em}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;width:100%;max-width:340px;align-self:center}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .cd{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.cam .ring{position:absolute;inset:14% 18% 22%;border:3px dashed rgba(255,255,255,.55);border-radius:50%}
.cam.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .35s forwards}@keyframes fl{to{opacity:0}}
.ok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ok .ic{width:96px;height:96px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.ok .ic svg{width:56px;height:56px}
.ok .t{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ok .n{font-size:24px;font-weight:700}
.warnb{background:#3a2a07;border:1px solid #6b4e0c;color:#ffd27a;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.lojas{display:flex;flex-direction:column;gap:10px}
.center{flex:1;display:flex;align-items:center;justify-content:center}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.demo{background:#25d366;color:#05200f;font-weight:700;text-align:center;font-size:13px;padding:4px;border-radius:8px;margin-bottom:10px}
</style></head>
