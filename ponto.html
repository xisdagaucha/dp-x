<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1310"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="ponto.webmanifest?v=1"><link rel="icon" href="icon-192.png?v=1"><link rel="apple-touch-icon" href="icon-192.png?v=1">
<title>Ponto X · Xis da Gaúcha</title>
<style>
:root{--bg:#000;--card:#121512;--card2:#1a1f1a;--ink:#f2f5f3;--mut:#93a199;--line:#1f2a21;--acc:#28c850;--acc2:#1e9e3e;--bad:#ff5a5a;--warn:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(620px 360px at 50% -80px,rgba(40,200,80,.18),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:12px;background:#000;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.logo{height:58px;width:auto;flex:none}
.p{border-left:4px solid var(--acc)}
.ok .tipo{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mark svg{width:28px;height:28px}
.brand b{display:block;font-size:20px;letter-spacing:.01em}.brand small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.grow{flex:1}
.gear{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.gear svg{width:22px;height:22px}
.clock{text-align:center;margin:18px 0 6px}
.clock .h{font-size:clamp(56px,13vw,108px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--mut);font-size:18px;margin-top:6px}
.hint{text-align:center;color:var(--mut);margin:8px 0 18px;font-size:17px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.net i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}.net.off i{background:var(--bad)}.net.off{color:var(--bad)}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;min-height:132px;justify-content:center;text-align:center;transition:transform .08s}
.p:active{transform:scale(.97);background:var(--card2)}
.av{width:58px;height:58px;border-radius:50%;background:rgba(40,200,80,.14);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:22px}
.p b{font-size:18px;line-height:1.2}.p small{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.box h2{margin:0;font-size:22px;text-align:center}
.box p{margin:0;text-align:center;color:var(--mut)}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.dots.err{animation:shake .35s}.dots.err i{border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:68px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:28px;font-weight:700;cursor:pointer}
.pad button:active{background:#2c3a32}
.pad .sm{font-size:16px;font-weight:600;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;font-size:17px;text-align:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#05200f}
.btn.ghost{background:none}
.input{width:100%;border:1px solid var(--line);background:#0b0f0d;border-radius:12px;padding:14px;font-size:17px;user-select:text;-webkit-user-select:text}
.input:focus{outline:2px solid var(--acc2)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.err{color:var(--bad);text-align:center;font-size:15px;min-height:1em}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;width:100%;max-width:340px;align-self:center}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .cd{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.cam .ring{position:absolute;inset:14% 18% 22%;border:3px dashed rgba(255,255,255,.55);border-radius:50%}
.cam.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .35s forwards}@keyframes fl{to{opacity:0}}
.ok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ok .ic{width:96px;height:96px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.ok .ic svg{width:56px;height:56px}
.ok .t{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ok .n{font-size:24px;font-weight:700}
.warnb{background:#3a2a07;border:1px solid #6b4e0c;color:#ffd27a;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.lojas{display:flex;flex-direction:column;gap:10px}
.center{flex:1;display:flex;align-items:center;justify-content:center}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.demo{background:#25d366;color:#05200f;font-weight:700;text-align:center;font-size:13px;padding:4px;border-radius:8px;margin-bottom:10px}
</style></head>

/* o mesmo cálculo é usado no DP X para gravar o PIN */
async function hashPin(funcId, pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`xis-ponto:${funcId}:${pin}`));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* reconhecimento facial (mesmo código no DP X e no Ponto X) */
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js';
const FACE_MODELOS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const Rosto = {
  estado: 'off', erro: null, _p: null, LIMITE: 0.55,
  carregar() {
    if (this._p) return this._p;
    this.estado = 'carregando';
    const p = new Promise((res, rej) => { if (window.faceapi) return res(); const s = document.createElement('script'); s.src = FACE_LIB; s.async = true; s.onload = () => res(); s.onerror = () => rej(new Error('Não consegui baixar o reconhecimento facial')); document.head.appendChild(s); })
      .then(async () => {
        if (faceapi.tf && faceapi.tf.ready) await faceapi.tf.ready();
        const n = faceapi.nets; await n.tinyFaceDetector.load(FACE_MODELOS); await n.faceLandmark68Net.load(FACE_MODELOS); await n.faceRecognitionNet.load(FACE_MODELOS);
        this.estado = 'pronto';
      });
    this._p = p.catch(e => { this.estado = 'erro'; this.erro = e; this._p = null; throw e; });
    return this._p;
  },
  /* 128 números que descrevem o rosto, ou null se não achou rosto */
  async descritor(canvas) {
    const r = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
    return r ? Array.from(r.descriptor) : null;
  },
  distancia(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); },
  /* quadro inteiro da câmera, espelhado (igual ao que a pessoa vê) */
  quadro(v) { const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0); return c; },
  /* recorte 3x4 em JPEG; com carimbo de data/hora quando recebe as linhas */
  recorte(q, w, h, linhas, qual = 0.66) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    const alvo = w / h; let sw = q.width, sh = q.height, sx = 0, sy = 0;
    if (q.width / q.height > alvo) { sw = q.height * alvo; sx = (q.width - sw) / 2; } else { sh = q.width / alvo; sy = (q.height - sh) / 2; }
    g.drawImage(q, sx, sy, sw, sh, 0, 0, w, h);
    if (linhas) {
      g.fillStyle = 'rgba(0,0,0,.62)'; g.fillRect(0, h - 64, w, 64); g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
      const caber = (t, px, bold) => { let s = px; do { g.font = `${bold ? 'bold ' : ''}${s}px system-ui, Arial, sans-serif`; s--; } while (g.measureText(t).width > w - 20 && s > 9); };
      caber(linhas[0], 24, true); g.fillText(linhas[0], 10, h - 36);
      caber(linhas[1], 14, false); g.fillText(linhas[1], 10, h - 14);
    }
    return c.toDataURL('image/jpeg', qual);
  }
};

  main() {
    this.root.innerHTML = `<div class="wrap">${this.demo ? '<div class="demo">DEMONSTRAÇÃO · nada é gravado</div>' : ''}
      <div class="top"><img class="logo" src="${LOGO_IMG}" alt="Xis da Gaúcha"><span class="brand grow"><b>Ponto X</b><small>${esc(this.lojaNome(this.loja()))}</small></span><span class="net" id="net"><i></i><span>online</span></span><button class="gear" id="gear" aria-label="Configurar">${GEAR}</button></div>
      <div class="clock"><div class="h" id="hora">--:--</div><div class="d" id="data"></div></div>
      <div class="hint">Toque no seu nome para registrar o ponto</div>
      <div id="lista"><div class="empty">Carregando a equipe…</div></div></div>`;
    $('#gear').onclick = () => this.config();
    clearInterval(this._clk); this._clk = setInterval(() => this.relogio(), 1000); this.relogio();
    this.rede(); this.manterTela();
    if (this.demo) return this.lista();
    if (this.unsub) this.unsub();
    this.unsub = this.db.collection('pontoPin').where('ativo', '==', true).onSnapshot(s => {
      this.pessoas = []; s.forEach(d => this.pessoas.push(Object.assign({ id: d.id }, d.data()))); this.lista();
    }, e => { $('#lista').innerHTML = `<div class="empty">Sem acesso à lista da equipe.<br><small>${esc(e.code || e.message)}</small><br><br>Confira se as regras de segurança do DP X foram publicadas no Firebase.</div>`; });
    this.sinal(); clearInterval(this._sin); this._sin = setInterval(() => this.sinal(), 5 * 60 * 1000);
  },
  lista() {
    const el = $('#lista'); if (!el) return;
    const aqui = this.loja(), ord = (a, b) => a.nome.localeCompare(b.nome);
    const daqui = this.pessoas.filter(p => p.loja === aqui).sort(ord), outros = this.pessoas.filter(p => p.loja !== aqui).sort(ord);
    const card = p => `<button class="p" data-p="${esc(p.id)}"><span class="av">${esc(iniciais(p.nome))}</span><b>${esc(p.apelido || primeiro(p.nome))}</b><small>${esc(p.nome.split(/\s+/).slice(1, 3).join(' '))}</small></button>`;
    el.innerHTML = !this.pessoas.length ? '<div class="empty">Ninguém liberado no tablet ainda.<br>No DP X, em Configurações → Ponto no tablet, confira se o PIN está desligado e clique em Salvar.</div>'
      : `<div class="grid">${daqui.map(card).join('')}</div>${outros.length ? `<div class="sec">Da outra loja</div><div class="grid">${outros.map(card).join('')}</div>` : ''}`;
    $$('[data-p]', el).forEach(b => b.onclick = () => this.tocar(this.pessoas.find(p => p.id === b.dataset.p)));
    if (this.pessoas.some(p => Array.isArray(p.face)) && Rosto.estado === 'off') Rosto.carregar().catch(() => {});
  },
  relogio() {
    const d = new Date(this.agora()), h = $('#hora'), dt = $('#data'); if (!h) return;
    h.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    const sem = SEMANA[d.getDay()]; dt.textContent = `${sem[0].toUpperCase() + sem.slice(1)}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
  },
  rede() { const n = $('#net'); if (!n) return; const on = navigator.onLine; n.classList.toggle('off', !on); n.lastElementChild.textContent = on ? 'online' : 'sem internet'; },
  async manterTela() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') this._wl = await navigator.wakeLock.request('screen'); } catch (e) { } },
  /* avisa o DP X que este tablet está ligado e acerta o relógio pelo do servidor */
  async sinal() {
    if (this.demo) return;
    try {
      const ref = this.db.collection('tablets').doc(dispId()), t0 = Date.now();
      await ref.set({ loja: this.loja(), visto: firebase.firestore.FieldValue.serverTimestamp(), versao: VERSAO, agent: navigator.userAgent.slice(0, 160) });
      const s = await ref.get({ source: 'server' }), t1 = Date.now(), v = s.get('visto');
      if (v && v.toMillis) this.offset = v.toMillis() - (t0 + t1) / 2;
    } catch (e) { }
  },

  /* ---------- janelas ---------- */
  ov(html, { fechar = true, tempo = 25000 } = {}) {
    this.fecharOv();
    const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="box">${html}</div>`;
    document.body.appendChild(o); this.overlay = o;
    if (fechar) o.addEventListener('click', e => { if (e.target === o) this.fecharOv(); });
    const reset = () => { clearTimeout(this._idle); if (tempo) this._idle = setTimeout(() => this.fecharOv(), tempo); };
    o.addEventListener('pointerdown', reset); reset();
    return o;
  },
  fecharOv() { clearTimeout(this._idle); this.pararCamera(); if (this.overlay) { this.overlay.remove(); this.overlay = null; } },

  /* ---------- tocar no nome ---------- */
  tocar(p) {
    if (!p) return;
    const j = this.janela(p);
    if (j.cedo) return this.cedo(p, j);
    p = Object.assign({}, p, { _entrada: j.entrada, _esp: j.esp });
    if (p.pedirPin === true && p.hash) return this.pin(p);
    this.confirmarRepetida(p);
  },
  /* horário de entrada da ficha: hoje é entrada? está cedo demais? */
  /* horário de hoje (no domingo usa o do domingo, se tiver) */
  horario(p) { const dom = new Date(this.inicioDia(this.agora())).getDay() === 0 && p.inicioDom; return { ini: dom ? p.inicioDom : p.inicio, fim: dom ? p.fimDom : p.fim }; },
  vezesHoje(id) { const h = ls.get('hoje_' + id, null); return h && h.d === this.inicioDia(this.agora()) ? h.n : 0; },
  /* nome da batida: 1ª entrada, depois saída/volta do intervalo, e saída no fim do turno */
  tipoBatida(p, n) {
    if (n === 1) return 'Início do turno';
    if (n % 2 === 1) return 'Volta do intervalo';
    const { ini, fim } = this.horario(p); if (!fim) return 'Saída registrada';
    const base = new Date(this.inicioDia(this.agora())), [h, m] = fim.split(':').map(Number), f = new Date(base); f.setHours(h, m, 0, 0);
    if (ini && fim <= ini) f.setDate(f.getDate() + 1); else if (h < 5) f.setDate(f.getDate() + 1);
    return this.agora() >= +f - 90 * 60000 ? 'Fim do turno' : 'Saída para o intervalo';
  },
  janela(p) {
    const agora = this.agora(), entrada = this.vezesHoje(p.id) === 0, ini = this.horario(p).ini;
    if (!ini) return { entrada };
    const [h, m] = ini.split(':').map(Number), esp = new Date(agora); esp.setHours(h, m, 0, 0);
    const antes = (+esp - agora) / 60000;
    if (entrada && p.antes != null && antes > p.antes && antes <= 240) return { cedo: true, esp: +esp, libera: +esp - p.antes * 60000 };
    return { entrada, esp: +esp };
  },
  inicioDia(t) { const d = new Date(t); if (d.getHours() < 5) d.setDate(d.getDate() - 1); d.setHours(5, 0, 0, 0); return +d; },
  cedo(p, j) {
    const o = this.ov(`<h2>Ainda não, ${esc(primeiro(p.nome))}</h2><p>Sua entrada é às <b>${hhmm(j.esp)}</b>.<br>Você pode bater o ponto a partir das <b style="color:var(--acc)">${hhmm(j.libera)}</b>.</p>
      <button class="btn pri" data-c>Ok</button><button class="btn ghost" data-g>A gerência liberou</button>`, { tempo: 12000 });
    $('[data-c]', o).onclick = () => this.fecharOv();
    $('[data-g]', o).onclick = () => {
      const o2 = this.ov(`<h2>Liberar o ponto</h2><p>Gerência: digite a senha do tablet para deixar ${esc(primeiro(p.nome))} bater o ponto agora.</p><label class="f">Senha do tablet<input class="input" id="lb-pw" type="password"></label><div class="err" id="lb-err"></div><button class="btn pri" data-s>Liberar</button><button class="btn ghost" data-c>Cancelar</button>`);
      $('[data-c]', o2).onclick = () => this.fecharOv();
      $('[data-s]', o2).onclick = async () => {
        if (!this.demo) { try { await firebase.auth().currentUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(TABLET_EMAIL, $('#lb-pw', o2).value)); } catch (e) { $('#lb-err', o2).textContent = 'Senha incorreta.'; return; } }
        this.camera(Object.assign({}, p, { _lib: true, _entrada: true, _esp: j.esp }));
      };
    };
  },
  /* PIN (só se a gestão ligar a opção no DP X) */
  pin(p) {
    const trava = ls.get('trava_' + p.id, 0);
    if (trava > Date.now()) { this.ov(`<h2>${esc(primeiro(p.nome))}</h2><p>PIN errado várias vezes. Tente de novo em ${Math.ceil((trava - Date.now()) / 1000)} segundos ou chame a gerência.</p><button class="btn" data-c>Ok</button>`); $('[data-c]', this.overlay).onclick = () => this.fecharOv(); return; }
    let dig = '';
    const o = this.ov(`<h2>Olá, ${esc(primeiro(p.nome))}!</h2><p>Digite o seu PIN</p><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="sm" data-c>Cancelar</button><button data-n="0">0</button><button class="sm" data-b>Apagar</button></div>`);
    const dots = () => $$('#dots i', o).forEach((d, i) => d.classList.toggle('on', i < dig.length));
    const errou = () => {
      const n = ls.get('erros_' + p.id, 0) + 1; ls.set('erros_' + p.id, n);
      if (n >= 3) { ls.set('trava_' + p.id, Date.now() + 60000); ls.set('erros_' + p.id, 0); this.fecharOv(); return this.pin(p); }
      const el = $('#dots', o); el.classList.add('err'); setTimeout(() => { el.classList.remove('err'); dig = ''; dots(); }, 400);
    };
    $$('[data-n]', o).forEach(b => b.onclick = async () => {
      if (dig.length >= 4) return; dig += b.dataset.n; dots();
      if (dig.length === 4) { if ((await hashPin(p.id, dig)) !== p.hash) return errou(); ls.set('erros_' + p.id, 0); this.confirmarRepetida(p); }
    });
    $('[data-b]', o).onclick = () => { dig = dig.slice(0, -1); dots(); };
    $('[data-c]', o).onclick = () => this.fecharOv();
  },
  /* evita bater duas vezes sem querer */
  confirmarRepetida(p) {
    const ult = ls.get('ult_' + p.id, 0);
    if (ult && this.agora() - ult < 3 * 60 * 1000) {
      const o = this.ov(`<h2>Já registrado</h2><p>${esc(primeiro(p.nome))}, você registrou o ponto às <b>${hhmm(ult)}</b>. Quer registrar de novo?</p><button class="btn pri" data-s>Registrar de novo</button><button class="btn ghost" data-c>Não, foi engano</button>`);
      $('[data-s]', o).onclick = () => this.camera(p); $('[data-c]', o).onclick = () => this.fecharOv();
      return;
    }
    this.camera(p);
  },

  /* ---------- câmera: abre na hora, tira a foto e confere o rosto ---------- */
  async camera(p) {
    const o = this.ov(`<h2>${esc(primeiro(p.nome))}, olhe para a câmera</h2><div class="cam" id="cam"><video id="vid" playsinline muted autoplay></video><span class="ring"></span><span class="cd" id="cd"></span></div><button class="btn ghost" data-c>Cancelar</button>`, { fechar: false, tempo: 30000 });
    $('[data-c]', o).onclick = () => this.fecharOv();
    let q;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      const v = $('#vid', o); v.srcObject = this.stream; await v.play();
      await wait(350);
      for (const n of [2, 1]) { if (this.overlay !== o) return; $('#cd', o).textContent = n; await wait(700); }
      if (this.overlay !== o) return;
      $('#cd', o).textContent = ''; $('#cam', o).classList.add('flash');
      q = Rosto.quadro(v);
    } catch (e) {
      if (this.overlay !== o) return;
      const o2 = this.ov(`<h2>Câmera indisponível</h2><div class="warnb">Não consegui abrir a câmera do tablet. O ponto pode ser registrado sem foto, mas fica marcado para a gerência conferir.</div><button class="btn pri" data-s>Registrar sem foto</button><button class="btn ghost" data-c>Cancelar</button>`, { fechar: false });
      $('[data-s]', o2).onclick = () => this.registrar(p, null, 'sem foto', null); $('[data-c]', o2).onclick = () => this.fecharOv();
      return;
    }
    this.pararCamera();
    const d = new Date(this.agora());
    const foto = Rosto.recorte(q, 300, 400, [`${dataBr(d)}  ${hhmm(+d)}`, `${p.nome} · ${this.lojaNome(this.loja())}`]);
    /* confere o rosto com o cadastro feito pela gestão */
    let rosto = 'sem cadastro', dist = null;
    if (Array.isArray(p.face) && p.face.length === 128) {
      this.ov(`<h2>Conferindo o rosto…</h2><img src="${foto}" alt="" style="width:150px;border-radius:12px;align-self:center">`, { fechar: false, tempo: 0 });
      if (Rosto.estado !== 'pronto') { try { await Promise.race([Rosto.carregar(), wait(6000)]); } catch (e) { } }
      if (Rosto.estado === 'pronto') {
        try { const desc = await Rosto.descritor(q); if (!desc) rosto = 'sem rosto'; else { dist = Math.round(Rosto.distancia(desc, p.face) * 1000) / 1000; rosto = dist <= Rosto.LIMITE ? 'ok' : 'diferente'; } }
        catch (e) { rosto = 'indisponivel'; }
      } else rosto = 'indisponivel';
    }
    if (rosto === 'sem rosto' || rosto === 'diferente') {
      const o3 = this.ov(`<h2>${rosto === 'sem rosto' ? 'Não achei o seu rosto' : 'O rosto não confere'}</h2><img src="${foto}" alt="" style="width:150px;border-radius:12px;align-self:center">
        <p>${rosto === 'sem rosto' ? 'Fique de frente para a câmera, sem boné e com o rosto iluminado.' : `Esta foto não parece com o cadastro de <b>${esc(primeiro(p.nome))}</b>. Confira se tocou no nome certo.`}</p>
        <button class="btn pri" data-s>Tentar de novo</button><button class="btn" data-r>Registrar assim mesmo</button><button class="btn ghost" data-c>Cancelar</button>`, { fechar: false });
      $('[data-s]', o3).onclick = () => this.camera(p);
      $('[data-r]', o3).onclick = () => this.registrar(p, foto, rosto, dist);
      $('[data-c]', o3).onclick = () => this.fecharOv();
      return;
    }
    this.registrar(p, foto, rosto, dist);
  },
  pararCamera() { if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } },

  /* ---------- grava a batida ---------- */
  async registrar(p, foto, rosto, dist) {
    this.ov(`<h2>Registrando…</h2><p>Só um instante</p>`, { fechar: false, tempo: 0 });
    const local = this.agora(); let atrasou = false;
    if (!this.demo) {
      const ref = this.db.collection('batidas').doc(), ts = firebase.firestore.FieldValue.serverTimestamp(), b = this.db.batch();
      const dados = { funcId: p.id, nome: p.nome, loja: this.loja(), at: ts, atLocal: Date.now(), disp: dispId(), origem: 'tablet', foto: !!foto, rosto: rosto || '', dist: dist == null ? null : dist, v: VERSAO };
      if (p._lib) dados.liberado = true;
      b.set(ref, dados);
      if (foto) b.set(this.db.collection('batidaFotos').doc(ref.id), { funcId: p.id, at: ts, img: foto });
      const ok = await Promise.race([b.commit().then(() => true, e => { this._erro = e; return false; }), wait(10000).then(() => 'lento')]);
      if (ok === false) {
        const e = this._erro || {}, o2 = this.ov(`<h2>Não consegui registrar</h2><div class="warnb">${/permission/i.test(e.code || '') ? 'O Firebase recusou a batida. Avise a gerência: as regras de segurança precisam ser publicadas de novo (DP X → Configurações → Segurança do Firebase).' : 'Erro: ' + esc(e.code || e.message || '')}</div><button class="btn pri" data-s>Tentar de novo</button><button class="btn ghost" data-c>Fechar</button>`, { fechar: false });
        $('[data-s]', o2).onclick = () => this.registrar(p, foto, rosto, dist); $('[data-c]', o2).onclick = () => this.fecharOv();
        return;
      }
      atrasou = ok === 'lento';
    }
    ls.set('ult_' + p.id, local);
    const n = this.vezesHoje(p.id) + 1; ls.set('hoje_' + p.id, { d: this.inicioDia(local), n });
    const tipo = this.tipoBatida(p, n);
    const atraso = p._entrada && p._esp && p.atraso != null ? Math.round((local - p._esp) / 60000) : 0, atrasado = atraso > (p.atraso || 0) && atraso < 240;
    this.ov(`<div class="ok">${foto ? `<img src="${foto}" alt="" style="width:170px;border-radius:14px">` : `<span class="ic">${CHECK}</span>`}<div class="tipo">${tipo}</div><div class="n">${esc(primeiro(p.nome))}, ponto registrado!</div><div class="t" style="font-size:44px">${hhmm(local)}</div><p>${esc(this.lojaNome(this.loja()))}</p>
      ${atrasou ? '<div class="warnb">A internet está lenta. O ponto vai ser enviado assim que a conexão voltar — mantenha o tablet ligado e avise a gerência.</div>' : ''}
      ${atrasado ? `<div class="warnb" style="background:#3a0f0f;border-color:#7a1f1f;color:#ffb3b3">Você chegou <b>${atraso} min atrasado(a)</b>. Sua entrada é às ${hhmm(p._esp)}. A gerência é avisada.</div>` : ''}
      ${!foto ? '<div class="warnb">Registrado sem foto.</div>' : rosto === 'sem rosto' || rosto === 'diferente' ? '<div class="warnb">Registrado. A gerência vai conferir a foto.</div>' : ''}</div>`, { tempo: atrasou || atrasado ? 7000 : 3500 });
  },

  /* ---------- configurar (pede a senha do tablet) ---------- */
  config() {
    const o = this.ov(`<h2>Configurar tablet</h2><p>Digite a senha do tablet para continuar.</p><label class="f">Senha do tablet<input class="input" id="c-pw" type="password"></label><div class="err" id="c-err"></div><button class="btn pri" data-s>Continuar</button><button class="btn ghost" data-c>Cancelar</button>`);
    $('[data-c]', o).onclick = () => this.fecharOv();
    $('[data-s]', o).onclick = async () => {
      if (!this.demo) {
        try { await firebase.auth().currentUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(TABLET_EMAIL, $('#c-pw', o).value)); }
        catch (e) { $('#c-err', o).textContent = 'Senha incorreta.'; return; }
      }
      const o2 = this.ov(`<h2>Configurar tablet</h2><p>Loja atual: <b>${esc(this.lojaNome(this.loja()))}</b><br><small>Versão ${VERSAO} · ${esc(dispId())}</small></p>
        <button class="btn" data-l>Trocar a loja</button><button class="btn" data-r>Recarregar o app</button>${this.demo ? '' : '<button class="btn" data-o>Desligar este tablet</button>'}<button class="btn ghost" data-c>Fechar</button>`);
      $('[data-l]', o2).onclick = () => { if (this.unsub) this.unsub(); this.escolherLoja(); };
      $('[data-r]', o2).onclick = () => location.reload();
      const out = $('[data-o]', o2); if (out) out.onclick = async () => { await firebase.auth().signOut(); ls.set('loja', null); location.reload(); };
      $('[data-c]', o2).onclick = () => this.fecharOv();
    };
  }
};
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
P.boot();
</script></body></html>
