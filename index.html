<title>DP X · Xis da Gaúcha</title><style>:root{--bg:#f3f4f2;--card:#fff;--ink:#121614;--mut:#66706a;--line:#e3e6e2;--acc:#1f8a4c;--acc2:#25d366;--accbg:#e4f4ea;--bad:#c62828;--badbg:#fdecec;--warn:#a86b00;--warnbg:#fff4dc;--info:#1f5fa8;--infobg:#e6eefa;--r:12px}

.mark svg{width:26px;height:26px}
.brand b{display:block;font-size:18px}.brand small{display:block;font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}

.nav:hover{background:#f1f3f0}.nav.on{background:var(--accbg);color:var(--acc);font-weight:600}

.main{flex:1;padding:24px 28px 60px;min-width:0;max-width:1200px}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}.head .sub{color:var(--mut);margin-top:4px}.head>.grow{min-width:220px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#c9cfca}.btn svg{width:16px;height:16px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:#1a7a43}

.input{width:100%;border:1px solid #d6dbd7;border-radius:9px;padding:8px 11px;background:#fff;min-height:38px}
.input:focus{outline:2px solid #bfe6cd;border-color:var(--acc)}
textarea.input{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field>span{font-size:12px;font-weight:600;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}

.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.table th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;background:#f7f8f6;border-bottom:1px solid var(--line)}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}.table tr.click{cursor:pointer}.table tr.click:hover td{background:#fafbfa}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}

.k-aniv{background:#d6338a}.k-empresa{background:#7b4bc7}.k-contrato{background:#d98a00}.k-pagto{background:#1f8a4c}.k-feriado{background:#c62828}.k-agenda{background:#1f6fd1}.k-exame{background:#0e8f8f}.k-adv{background:#555}.k-entrevista{background:#b5530a}.k-teste{background:#5a6b10}.k-vaga{background:#c62828}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#121614;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2)}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}

<body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="config.js"></script><script>/* DP X · Departamento pessoal do Xis da Gaúcha — núcleo */
const APP_VERSION = '1.13.0';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const brl = v => 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const stripAcc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const norm = s => stripAcc(s).toLowerCase().trim();

/* datas como texto AAAA-MM-DD (sem fuso) */
const D = {
  str(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; },
  hoje() { return D.str(new Date()); },
  parse(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
  add(s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.str(d); },
  addMeses(s, n) { const d = D.parse(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, ult)); return D.str(d); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 86400000); },
  fmt(s) { if (!s) return '–'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; },
  curto(s) { if (!s) return '–'; const [, m, d] = s.split('-'); return `${d}/${m}`; },
  ext(s) { const d = D.parse(s); return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; },
  semana(s) { return SEMANA[D.parse(s).getDay()]; },
  idade(s) { if (!s) return null; const h = new Date(), n = D.parse(s); let a = h.getFullYear() - n.getFullYear(); if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) a--; return a; },
  tempo(de, ate = D.hoje()) {
    if (!de) return '–'; let a = D.parse(de), b = D.parse(ate); if (b < a) return 'ainda não começou';
    let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth(); if (b.getDate() < a.getDate()) m--;
    const anos = Math.floor(m / 12), meses = m % 12, dias = D.diff(D.addMeses(de, m), ate);
    const p = []; if (anos) p.push(anos + (anos > 1 ? ' anos' : ' ano')); if (meses) p.push(meses + (meses > 1 ? ' meses' : ' mês')); if (!anos && !meses) p.push(dias + (dias === 1 ? ' dia' : ' dias'));
    return p.join(' e ');
  }
};
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const fmtDT = t => { const d = new Date(t); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

/* feriados nacionais (fixos + móveis pela Páscoa) */
function pascoa(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return D.str(new Date(y, mo - 1, da)); }

  const f = [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência'], ['10-12', 'Nossa Senhora Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Consciência Negra'], ['12-25', 'Natal']].map(([md, n]) => ({ date: `${y}-${md}`, title: n, tipo: 'nacional' }));
  const p = pascoa(y);
  f.push({ date: D.add(p, -48), title: 'Carnaval (ponto facultativo)', tipo: 'facultativo' }, { date: D.add(p, -47), title: 'Carnaval (ponto facultativo)', tipo: 'facultativo' }, { date: D.add(p, -2), title: 'Sexta-feira Santa', tipo: 'nacional' }, { date: D.add(p, 60), title: 'Corpus Christi (ponto facultativo)', tipo: 'facultativo' });
  for (const l of (Store.cfg().feriadosLocais || [])) if (l.md) f.push({ date: `${y}-${l.md}`, title: l.nome + (l.loja ? ' · ' + Lojas.curto(l.loja) : ''), tipo: 'local', loja: l.loja || '' });
  return f;
}
/* 5º dia útil: conta segunda a sábado, sem domingos e feriados nacionais */
function quintoDiaUtil(y, m) {
  const fer = new Set(feriados(y).filter(f => f.tipo === 'nacional').map(f => f.date));
  let d = new Date(y, m, 1), n = 0;
  while (true) { const s = D.str(d); if (d.getDay() !== 0 && !fer.has(s)) { n++; if (n === 5) return s; } d.setDate(d.getDate() + 1); }
}

function toast(msg, cls = '') { $$('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function modal({ title, body, foot = '', wide = false, onClose }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="mh"><h2>${title}</h2><button class="x" data-x aria-label="Fechar">×</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  const m = { el: ov, close() { ov.remove(); document.removeEventListener('keydown', k); onClose && onClose(); } };
  const k = e => { if (e.key === 'Escape') m.close(); };
  document.addEventListener('keydown', k);
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) m.close(); });
  return m;
}
function confirmar(texto, { ok = 'Confirmar', perigo = false } = {}) {
  return new Promise(res => { let r = false; const m = modal({ title: 'Confirmar', body: `<p style="margin:0">${texto}</p>`, foot: `<button class="btn" data-x>Cancelar</button><button class="btn ${perigo ? 'danger' : 'primary'}" id="cf-ok">${ok}</button>`, onClose: () => res(r) }); $('#cf-ok', m.el).onclick = () => { r = true; m.close(); }; });
}

function F(label, key, val, { type = 'text', opts, cls = '', ph = '', attrs = '' } = {}) {
  const v = val == null ? '' : val;
  let inp;
  if (type === 'select') inp = `<select class="input" data-k="${key}" ${attrs}>${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (type === 'area') inp = `<textarea class="input" data-k="${key}" placeholder="${esc(ph)}" ${attrs}>${esc(v)}</textarea>`;
  else inp = `<input class="input" data-k="${key}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}" ${type === 'money' ? 'inputmode="decimal"' : ''} ${attrs}>`;
  if (type === 'money') inp = inp.replace('type="money"', 'type="text"');

function setDeep(o, path, v) { const p = path.split('.'); let c = o; while (p.length > 1) { const k = p.shift(); c = c[k] = c[k] || {}; } c[p[0]] = v; }
function getDeep(o, path) { return path.split('.').reduce((a, k) => a == null ? a : a[k], o); }

const Func = {
  ativos() { return Store.all('funcionarios').filter(f => f.status !== 'desligado').sort((a, b) => a.nome.localeCompare(b.nome)); },
  desligados() { return Store.all('funcionarios').filter(f => f.status === 'desligado').sort((a, b) => (b.desligamento?.data || '').localeCompare(a.desligamento?.data || '')); },
  get(id) { return Store.get('funcionarios', id); },
  /* contrato de experiência: 1º período (30) + renovação (60) */
  contrato(f) {
    if (!f.admissao) return null;
    const c = Store.cfg(), e1 = +f.exp1 || c.exp1, e2 = +f.exp2 || c.exp2;
    const fim1 = D.add(f.admissao, e1 - 1), fim2 = D.add(fim1, e2);
    const st = f.contratoStatus || 'exp1';
    if (f.status === 'desligado') return { st: 'fim', fim1, fim2, e1, e2 };
    if (st === 'efetivado') return { st, fim1, fim2, e1, e2, txt: 'Efetivado' };
    const fim = st === 'renovado' ? fim2 : fim1, rest = D.diff(D.hoje(), fim);
    return { st, fim1, fim2, e1, e2, fim, rest, txt: st === 'renovado' ? `Experiência renovada até ${D.fmt(fim2)}` : `Experiência até ${D.fmt(fim1)}` };
  },
  contratoPill(f) {
    const c = this.contrato(f); if (!c) return '<span class="pill">sem data</span>';
    if (f.status === 'desligado') return '<span class="pill bad">desligado</span>';
    if (c.st === 'efetivado') return `<span class="pill ok" title="Experiência terminou em ${D.fmt(c.fim2)}">efetivado${D.hoje() > c.fim2 ? ' · experiência até ' + D.fmt(c.fim2) : ''}</span>`;
    const cls = c.rest < 0 ? 'bad' : c.rest <= Store.cfg().avisoDias ? 'warn' : 'info';
    return `<span class="pill ${cls}">${c.st === 'renovado' ? 'renovado' : 'experiência'} · ${c.rest < 0 ? 'venceu ' + D.curto(c.fim) : c.rest === 0 ? 'vence hoje' : 'faltam ' + c.rest + 'd'}</span>`;
  },
  advDe(id) { return Store.all('docs').filter(d => d.tipo === 'advertencia' && d.funcId === id).sort((a, b) => (b.dados.dataFato || '').localeCompare(a.dados.dataFato || '')); },
  entregasDe(id) { return Store.all('entregas').filter(e => e.funcId === id).sort((a, b) => b.data.localeCompare(a.data)); },
  pendUniformes(id) { const p = []; this.entregasDe(id).forEach(e => e.itens.forEach((it, i) => { if (!it.devolvido) p.push({ e, it, i }); })); return p; }
};

/* eventos do calendário (automáticos + agenda) entre duas datas AAAA-MM-DD */
function eventosEntre(de, ate, { auto = true } = {}) {
  const out = [], y0 = +de.slice(0, 4), y1 = +ate.slice(0, 4), dentro = s => s >= de && s <= ate;
  const push = (date, title, kind, extra = {}) => { if (dentro(date)) out.push(Object.assign({ date, title, kind }, extra)); };
  if (auto) {
    const fs = Store.all('funcionarios');
    for (let y = y0; y <= y1; y++) {
      for (const f of fs) {
        if (f.status === 'desligado') continue;
        if (f.nascimento) push(`${y}-${f.nascimento.slice(5)}`, `Aniversário · ${f.nome}`, 'aniv', { funcId: f.id });
        if (f.admissao && +f.admissao.slice(0, 4) < y) { const n = y - +f.admissao.slice(0, 4); push(`${y}-${f.admissao.slice(5)}`, `${n} ${n > 1 ? 'anos' : 'ano'} de empresa · ${f.nome}`, 'empresa', { funcId: f.id }); }
      }
      feriados(y).forEach(h => push(h.date, h.title, 'feriado'));
    }
    for (const f of fs) {
      if (f.status === 'desligado') continue;
      const c = Func.contrato(f);
      if (c && c.st === 'exp1') push(c.fim1, `Fim dos ${c.e1} dias · ${f.nome}`, 'contrato', { funcId: f.id });
      if (c && (c.st === 'exp1' || c.st === 'renovado')) push(c.fim2, `Fim da experiência (90 dias) · ${f.nome}`, 'contrato', { funcId: f.id });
      if (f.proxExame) push(f.proxExame, `Exame periódico (ASO) · ${f.nome}`, 'exame', { funcId: f.id });
    }
    if (Store.cfg().pagamentos) {
      let d = D.parse(de); d.setDate(1);
      while (D.str(d) <= ate) { const y = d.getFullYear(), m = d.getMonth(); push(`${y}-${pad2(m + 1)}-20`, 'Adiantamento (dia 20)', 'pagto'); push(quintoDiaUtil(y, m), 'Salário (5º dia útil)', 'pagto'); d.setMonth(m + 1); }
    }
    Store.all('docs').filter(x => x.tipo === 'advertencia' && x.dados.tipoAdv === 'suspensao' && x.dados.inicio).forEach(x => { const f = Func.get(x.funcId); for (let i = 0; i < (+x.dados.dias || 1); i++) push(D.add(x.dados.inicio, i), `Suspensão · ${f ? f.nome : ''}`, 'adv', { funcId: x.funcId }); });
  }
  if (auto) for (const c of Store.all('candidatos')) {
    if (['reprovado', 'desistiu'].includes(c.etapa)) continue;
    const vaga = c.cargo ? ' (' + c.cargo + ')' : '';
    if (c.entrevista && c.entrevista.data && !c.entrevista.resultado) push(c.entrevista.data, `Entrevista · ${c.nome}${vaga}`, 'entrevista', { hora: c.entrevista.hora || '', candId: c.id });
    if (c.teste && c.teste.data && !c.teste.resultado) for (let i = 0; i < (+c.teste.diasPrev || 1); i++) push(D.add(c.teste.data, i), `Teste${+c.teste.diasPrev > 1 ? ` (dia ${i + 1})` : ''} · ${c.nome}${vaga}`, 'teste', { hora: c.teste.hora || '', candId: c.id });
    if (c.exame && c.exame.data && !c.exame.feito) push(c.exame.data, `Exame admissional · ${c.nome}`, 'exame', { hora: c.exame.hora || '', candId: c.id });
  }
  if (auto) for (const f of Store.all('funcionarios')) { const x = f.desligamento && f.desligamento.exameDem; if (x && x.data) push(x.data, `Exame demissional · ${f.nome}`, 'exame', { hora: x.hora || '', funcId: f.id }); }
  for (const e of Store.all('eventos')) {
    const base = { kind: 'agenda', ev: e, hora: e.hora || '', funcId: e.funcId || '' };
    const t = e.titulo + (e.loja ? ' · ' + Lojas.curto(e.loja) : '');
    if (!e.repetir) { push(e.data, t, 'agenda', base); continue; }
    for (let k = 0; k < 2000; k++) {
      const s = e.repetir === 'semanal' ? D.add(e.data, 7 * k) : e.repetir === 'mensal' ? D.addMeses(e.data, k) : D.addMeses(e.data, 12 * k);
      if (s > ate || (e.ate && s > e.ate)) break;
      if (s >= de) push(s, t, 'agenda', base);
    }
  }
  return out.sort((a, b) => (a.date + (a.hora || '')).localeCompare(b.date + (b.hora || '')));
}
const KIND = { aniv: 'Aniversário', empresa: 'Tempo de empresa', contrato: 'Contrato', pagto: 'Pagamento', feriado: 'Feriado', agenda: 'Agenda', exame: 'Exame', adv: 'Suspensão', entrevista: 'Entrevista', teste: 'Teste' };

/* avisos da tela inicial */
function avisos() {
  const c = Store.cfg(), out = [], hoje = D.hoje();
  for (const f of Func.ativos()) {
    const k = Func.contrato(f);
    if (k && (k.st === 'exp1' || k.st === 'renovado') && k.rest <= c.avisoDias) out.push({ tipo: 'contrato', f, k, prio: k.rest, txt: `${k.st === 'renovado' ? 'Renovação' : `Contrato de ${k.e1} dias`} de <b>${esc(f.nome)}</b> ${k.rest < 0 ? `venceu em ${D.fmt(k.fim)}` : k.rest === 0 ? 'vence hoje' : `vence em ${k.rest} ${k.rest > 1 ? 'dias' : 'dia'} (${D.fmt(k.fim)})`}` });
    if (f.proxExame && D.diff(hoje, f.proxExame) <= 15) out.push({ tipo: 'exame', f, prio: D.diff(hoje, f.proxExame), txt: `Exame periódico de <b>${esc(f.nome)}</b> ${D.diff(hoje, f.proxExame) < 0 ? 'venceu em' : 'em'} ${D.fmt(f.proxExame)}` });
    const sus = Func.advDe(f.id).find(x => x.dados.tipoAdv === 'suspensao' && x.dados.retorno && x.dados.retorno >= hoje && x.dados.inicio <= hoje);
    if (sus) out.push({ tipo: 'susp', f, prio: 50, txt: `<b>${esc(f.nome)}</b> está suspenso(a), volta em ${D.fmt(sus.dados.retorno)}` });
  }
  for (const v of Rec.vagas()) out.push({ tipo: 'vaga', prio: 30, txt: `<b>${esc(Lojas.curto(v.loja))}</b>: falta${v.falta > 1 ? 'm' : ''} ${v.falta} ${esc(v.cargo)} (tem ${v.tem} de ${v.ideal})${v.proc ? ` · ${v.proc} em seleção` : ' · precisa recrutar'}` });
  return out.sort((a, b) => a.prio - b.prio);
}

/* visualização de impressão dentro do próprio app (sem abrir outra janela) */
function imprimir(titulo, paginas) {
  if (!paginas.length) paginas = ['<div class="pg"><p style="text-align:center;margin-top:40mm;font-size:16px">Nada para imprimir.</p></div>'];
  const doc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${PRINT_CSS}</style></head><body>${paginas.join('')}</body></html>`;
  $$('.pv-ov').forEach(x => x.remove());
  const ov = document.createElement('div'); ov.className = 'pv-ov';
  ov.innerHTML = `<div class="pv-bar"><b class="grow">${esc(titulo)}</b><button class="btn primary" data-pv="p">${ico('print')} Imprimir</button><button class="btn" data-pv="x">Fechar</button></div><iframe class="pv-fr" title="Visualização"></iframe>`;
  document.body.appendChild(ov);
  const fr = $('.pv-fr', ov); fr.srcdoc = doc;
  const fechar = () => { ov.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', k);
  ov.addEventListener('click', e => { const b = e.target.closest('[data-pv]'); if (!b) return; if (b.dataset.pv === 'x') return fechar(); try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (er) { toast('Não consegui abrir a impressão', 'bad'); } });
}

/* empresa que registra os funcionários (a que tem razão social); sem nome de loja */
function empresa() { return Lojas.list().find(l => l.razao) || Lojas.list()[0] || {}; }
function cabEmpresa() {
  const l = empresa();
  return `<div class="emp"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO_PAPEL}" alt="" style="height:46px"><div><b>${esc(l.razao || 'Xis da Gaúcha')}</b><br>CNPJ ${esc(l.cnpj || '')}<br>${esc([l.endereco, l.cidade].filter(Boolean).join(' · '))}</div></div><div style="text-align:right">Xis da Gaúcha</div></div>`;
}
function cab(lojaId) {
  const l = Lojas.get(lojaId) || {};
  return `<div class="emp"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO_PAPEL}" alt="" style="height:46px"><div><b>${esc(l.razao || 'Xis da Gaúcha')}</b><br>CNPJ ${esc(l.cnpj || '')}<br>${esc([l.endereco, l.cidade].filter(Boolean).join(' · '))}</div></div><div style="text-align:right">Xis da Gaúcha<br>${esc(l.nome || '')}</div></div>`;
}
const cel = (rot, val, s = 2) => `<div class="s${s}"><small>${rot}</small>${esc(val || '')}&nbsp;</div>`;
const local = lojaId => `<div class="loc">${esc((Lojas.get(lojaId) || {}).cidade || '')}, ____ de ____________________ de ________.</div>`;

const DOCS = {
  ficha: {
    nome: 'Ficha de cadastro do funcionário', desc: 'Todos os dados da ficha, para conferir e assinar.',
    pagina(f) {
      const k = Func.contrato(f) || {};
      return `<div class="pg">${cab(f.loja)}<h1>Ficha de cadastro do funcionário</h1>
        <h2>Dados pessoais</h2><div class="fg">${cel('Nome completo', f.nome, 4)}${cel('Data de nascimento', D.fmt(f.nascimento), 2)}
        ${cel('CPF', f.cpf)}${cel('RG / órgão', [f.rg, f.rgOrgao].filter(Boolean).join(' · '))}${cel('PIS', f.pis)}
        ${cel('CTPS nº / série', [f.ctps, f.ctpsSerie].filter(Boolean).join(' / '))}${cel('Título de eleitor', f.titulo)}${cel('Estado civil', f.estadoCivil)}
        ${cel('Escolaridade', f.escolaridade)}${cel('Nome da mãe', f.mae, 4)}${cel('Nome do pai', f.pai, 6)}
        ${cel('Endereço', f.endereco, 4)}${cel('Bairro', f.bairro)}${cel('Cidade / UF', f.cidade, 3)}${cel('CEP', f.cep, 1)}${cel('Telefone', f.telefone, 2)}
        ${cel('E-mail', f.email, 3)}${cel('Contato de emergência', f.emergencia, 3)}</div>
        <h2>Dados do contrato</h2><div class="fg">${cel('Cargo', f.cargo)}${cel('Loja', Lojas.nome(f.loja))}${cel('Salário', f.salario ? brl(num(f.salario)) : '')}
        ${cel('Data de admissão', D.fmt(f.admissao))}${cel('Experiência', k.e1 ? `${k.e1} + ${k.e2} dias` : '')}${cel('Horário', f.horario)}${cel('Carga horária', f.carga)}${cel('Dias de trabalho', (f.dias || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => SEMANA[i].slice(0, 3)).join(', '), 4)}
        ${cel('Fim do 1º período', D.fmt(k.fim1))}${cel('Fim da renovação', D.fmt(k.fim2))}${cel('Chave Pix / banco', f.pix)}</div>
        <h2>Uniforme</h2><div class="fg">${cel('Camiseta', f.tamCamiseta)}${cel('Calça', f.tamCalca)}${cel('Calçado', f.tamCalcado)}</div>
        ${f.obs ? `<h2>Observações</h2><div class="box">${esc(f.obs)}</div>` : ''}
        <p style="margin-top:16px">Declaro que as informações acima são verdadeiras e me comprometo a comunicar à empresa qualquer alteração.</p>
        ${local(f.loja)}<div class="ass"><div>${esc(f.nome)}<br>Funcionário(a)</div><div>${esc((Lojas.get(f.loja) || {}).razao || 'Empresa')}<br>Empregador</div></div></div>`;
    }
  },
  uniformes: {
    nome: 'Termo de recebimento de uniformes', desc: 'Lista do que foi entregue, para o funcionário assinar.',
    pagina(f, d) {
      const it = d.itens || [];
      return `<div class="pg">${cab(f.loja)}<h1>Termo de recebimento de uniformes</h1>
        <p>Eu, <b>${esc(f.nome)}</b>, CPF ${esc(f.cpf || '_______________')}, ${esc(f.cargo || '')}, declaro ter recebido da empresa <b>${esc((Lojas.get(f.loja) || {}).razao || 'Xis da Gaúcha')}</b>, em ${D.fmt(d.data)}, os uniformes e equipamentos abaixo, em perfeito estado de conservação:</p>
        <table><thead><tr><th>Peça</th><th style="width:90px">Tamanho</th><th style="width:90px">Quantidade</th></tr></thead><tbody>${it.map(x => `<tr><td>${esc(x.peca)}</td><td>${esc(x.tam || '–')}</td><td>${x.qtd}</td></tr>`).join('')}</tbody></table>
        <p>Comprometo-me a:</p>
        <p>1. Usar os uniformes somente durante o horário de trabalho e mantê-los limpos e em bom estado de conservação;<br>
        2. Não emprestar, vender ou ceder os uniformes a terceiros;<br>
        3. Devolver todos os uniformes recebidos no momento do desligamento da empresa;<br>
        4. Em caso de perda, extravio ou dano causado por mau uso, autorizo o desconto do valor correspondente em meu salário, conforme o art. 462, § 1º, da CLT.</p>
        ${d.obs ? `<div class="box">${esc(d.obs)}</div>` : ''}
        ${local(f.loja)}<div class="ass"><div>${esc(f.nome)}<br>Funcionário(a)</div><div>${esc(d.by || 'Responsável')}<br>Entregue por</div></div></div>`;
    }
  },
  advertencia: {
    nome: 'Advertência / suspensão', desc: 'Escolha o tipo e o motivo; sai pronta para assinar.',
    pagina(f, d) {
      const motivos = (d.motivos || []).map(id => (Store.cfg().motivosAdv.find(m => m.id === id) || { texto: id })).map(m => m.texto);
      if (d.outro) motivos.push(d.outro);
      const porque = motivos.length ? motivos.join('; ') : '';
      const sus = d.tipoAdv === 'suspensao', verbal = d.tipoAdv === 'verbal';
      const titulo = sus ? 'Comunicado de suspensão disciplinar' : verbal ? 'Registro de advertência verbal' : 'Advertência disciplinar';
      const corpo = sus
        ? `<p>Pelo presente, comunicamos que V.Sa. está <b>suspenso(a) de suas atividades por ${d.dias} ${+d.dias > 1 ? 'dias' : 'dia'}</b>, no período de ${D.fmt(d.inicio)} a ${D.fmt(D.add(d.inicio, (+d.dias || 1) - 1))}, devendo retornar ao trabalho em <b>${D.fmt(d.retorno)}</b>, pelo motivo de que, em ${D.fmt(d.dataFato)}, ${esc(porque)}.</p><p>Os dias de suspensão não serão remunerados. Esclarecemos que a reincidência poderá acarretar a aplicação de penalidades mais severas previstas em lei, inclusive a rescisão do contrato de trabalho por justa causa, nos termos do art. 482 da CLT.</p>`
        : verbal
          ? `<p>Registramos que, nesta data, V.Sa. recebeu <b>advertência verbal</b> pelo motivo de que, em ${D.fmt(d.dataFato)}, ${esc(porque)}.</p><p>Solicitamos que o fato não se repita. A reincidência poderá acarretar advertência por escrito e demais penalidades previstas em lei.</p>`
          : `<p>Pela presente, fica V.Sa. <b>advertido(a)</b> pelo motivo de que, em ${D.fmt(d.dataFato)}, ${esc(porque)}.</p><p>Solicitamos que o fato não se repita. Esclarecemos que a reincidência poderá acarretar a aplicação de penalidades mais severas previstas em lei, inclusive suspensão e rescisão do contrato de trabalho por justa causa, nos termos do art. 482 da CLT.</p>`;
      return `<div class="pg">${cab(f.loja)}<h1>${titulo}</h1>

        <div>${esc(d.test1 || '')}<br>Testemunha 1 (se recusar assinar)</div><div>${esc(d.test2 || '')}<br>Testemunha 2 (se recusar assinar)</div></div></div>`;

function imprimirDoc(tipo, f, dados) { imprimir(DOCS[tipo].nome + ' · ' + f.nome, [DOCS[tipo].pagina(f, dados || {})]); }

/* ======================= RECRUTAMENTO E ADMISSÃO ======================= */
const ETAPAS = { novo: ['Novo', ''], entrevista: ['Entrevista marcada', 'info'], teste: ['Em teste', 'warn'], aprovado: ['Aprovado', 'ok'], exame: ['Exame marcado', 'info'], contratado: ['Contratado', 'ok'], reprovado: ['Não aprovado', 'bad'], desistiu: ['Desistiu / não veio', 'bad'] };
const EM_ANDAMENTO = ['novo', 'entrevista', 'teste', 'aprovado', 'exame'];
const SEMANA_LONGA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

/* mensagens prontas: troca {campos} pelos dados */
function preencher(tpl, v) { return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m).replace(/\n{3,}/g, '\n\n'); }
function endLoja(id) { const l = Lojas.get(id) || {}; return [l.endereco, String(l.cidade || '').replace(/\/\w+$/, '')].filter(Boolean).join(', '); }
function abrirWa(tel, msg) {
  let n = String(tel || '').replace(/\D/g, ''); if (!n) return toast('Coloque o telefone primeiro', 'bad');
  if (n.length <= 11) n = '55' + n;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}
/* mostra a mensagem para conferir antes de abrir o WhatsApp */
function mandarMsg(titulo, tel, msg) {
  const m = modal({ title: titulo, body: `<textarea class="input" id="mm-t" style="min-height:240px">${esc(msg)}</textarea><p class="muted small" style="margin:0">Pode mudar o texto antes de mandar. Os modelos ficam em Configurações.</p>`, foot: `<button class="btn" data-x>Fechar</button><button class="btn" id="mm-c">Copiar</button><button class="btn primary" id="mm-w" ${tel ? '' : 'disabled'}>${ico('wa')} Abrir no WhatsApp</button>` });
  $('#mm-c', m.el).onclick = async () => { try { await navigator.clipboard.writeText($('#mm-t', m.el).value); toast('Mensagem copiada'); } catch (e) { $('#mm-t', m.el).select(); document.execCommand('copy'); toast('Mensagem copiada'); } };
  $('#mm-w', m.el).onclick = () => { abrirWa(tel, $('#mm-t', m.el).value); m.close(); };
}
const Msg = {
  vars(c, x = {}) { const d = x.data || D.hoje(); return { nome: c.nome, primeiro: String(c.nome || '').split(' ')[0], cargo: c.cargo || '', loja: Lojas.nome(c.loja), endereco: endLoja(c.loja), data: D.fmt(d), dia: D.curto(d), semana: SEMANA_LONGA[D.parse(d).getDay()], hora: x.hora || '', local: x.local || (Lojas.get(c.loja) || {}).clinica || '', exames: x.exames || Store.cfg().examesPadrao, combinado: x.obs || '' }; },
  texto(tipo, c, x) { return preencher((Store.cfg().msgs || {})[tipo] || DEFAULT_CFG.msgs[tipo], this.vars(c, x)); },
  mandar(tipo, c, x) { mandarMsg({ entrevista: 'Mensagem da entrevista', teste: 'Mensagem do teste', exame: 'Mensagem do exame admissional', aniversario: 'Mensagem de aniversário' }[tipo], c.telefone, this.texto(tipo, c, x)); }
};

const Rec = {
  all() { return Store.all('candidatos').sort((a, b) => (b.upd || 0) - (a.upd || 0)); },
  vagas() {
    const at = Func.ativos(), cs = Store.all('candidatos').filter(c => EM_ANDAMENTO.includes(c.etapa));
    return (Store.cfg().quadro || []).map(q => {
      const tem = at.filter(f => f.loja === q.loja && norm(f.cargo) === norm(q.cargo)).length;
      const proc = cs.filter(c => c.loja === q.loja && norm(c.cargo) === norm(q.cargo)).length;
      return { loja: q.loja, cargo: q.cargo, ideal: +q.qtd || 0, tem, falta: Math.max(0, (+q.qtd || 0) - tem), proc };
    }).filter(v => v.falta > 0);
  },
  /* o passo a passo da admissão */
  passos(c) {
    const f = c.funcId ? Func.get(c.funcId) : null, ch = c.check || {}, fim = ['reprovado', 'desistiu'].includes(c.etapa);
    const e = c.entrevista || {}, t = c.teste || {}, x = c.exame || {};
    const aprovado = ['aprovado', 'exame', 'contratado'].includes(c.etapa);
    const temUnif = f && Func.entregasDe(f.id).length > 0, temImg = f && Store.all('docs').some(d => d.funcId === f.id && d.tipo === 'imagem' && d.assinado);
    const temContrato = f && (f.anexos || []).some(a => a.cat === 'Contrato');
    return [
      { k: 'entrevista', t: 'Entrevista', ok: !!e.resultado || aprovado || !!t.data, info: e.data ? `${D.fmt(e.data)}${e.hora ? ' às ' + e.hora : ''}${e.resultado ? ' · ' + e.resultado : ''}` : '' },
      { k: 'teste', t: 'Teste', ok: !!t.resultado || (aprovado && !t.data), pulado: aprovado && !t.data, info: t.data ? `${D.fmt(t.data)} · ${t.diasFeitos ? t.diasFeitos + ' de ' + (t.diasPrev || '?') + ' dias' : (t.diasPrev || 3) + ' dias previstos'}${t.valor ? ` · ${brl(t.valor)}${t.pago ? ' pago' : ' a pagar'}` : ''}${t.resultado ? ' · ' + t.resultado : ''}` : '' },
      { k: 'aprovado', t: 'Aprovado', ok: aprovado, info: fim ? ETAPAS[c.etapa][0] : '' },
      { k: 'exame', t: 'Exame admissional', ok: !!x.feito, info: x.data ? `${D.fmt(x.data)}${x.hora ? ' às ' + x.hora : ''} · ${brl(x.valor || 0)}${x.feito ? ' · feito' : ''}` : '' },
      { k: 'ficha', t: 'Cadastro do funcionário', ok: !!f, info: f ? `admissão ${D.fmt(f.admissao)}` : '' },
      { k: 'contrato', t: 'Contrato assinado', ok: !!ch.contrato || !!temContrato },
      { k: 'uniforme', t: 'Uniformes entregues', ok: !!ch.uniforme || !!temUnif },
      { k: 'imagem', t: 'Autorização de uso de imagem', ok: !!ch.imagem || !!temImg }
    ];
  },
  proximo(c) { if (['reprovado', 'desistiu'].includes(c.etapa)) return null; return this.passos(c).find(p => !p.ok) || null; },
  custos(de, ate) {
    let teste = 0, exAdm = 0, exDem = 0; const dentro = d => d && d >= de && d <= ate;
    Store.all('candidatos').forEach(c => { if (c.teste && c.teste.valor && dentro(c.teste.data)) teste += +c.teste.valor; if (c.exame && c.exame.valor && dentro(c.exame.data)) exAdm += +c.exame.valor; });
    Store.all('funcionarios').forEach(f => { const x = f.desligamento && f.desligamento.exameDem; if (x && dentro(x.data)) exDem += +x.valor || 0; });
    return { teste, exAdm, exDem, total: teste + exAdm + exDem };
  }
};

    <div class="card col" style="margin-bottom:16px"><div class="row"><h2 class="grow">Quadro da equipe</h2><button class="btn sm" id="rc-q">${ico('edit')} Definir quadro ideal</button></div>
    ${quadro.length ? `<div class="grid g3">${quadro.map(q => { const falta = Math.max(0, (+q.qtd || 0) - q.tem); return `<div class="card" style="padding:12px;${falta ? 'border-color:#f0c4c4;background:#fffafa' : ''}"><div class="row"><b class="grow">${esc(q.cargo)}</b><span class="pill">${esc(Lojas.curto(q.loja))}</span></div><div style="font-size:24px;font-weight:700;margin:4px 0">${q.tem} <span class="muted" style="font-size:15px">de ${q.qtd}</span></div>${falta ? `<span class="pill bad">falta${falta > 1 ? 'm' : ''} ${falta}</span> ${q.proc ? `<span class="pill info">${q.proc} em seleção</span>` : `<button class="btn sm" data-nv="${esc(q.loja)}|${esc(q.cargo)}">${ico('plus')} Candidato</button>`}` : '<span class="pill ok">completo</span>'}</div>`; }).join('')}</div>` : '<p class="muted" style="margin:0">Defina quantas pessoas cada loja precisa em cada cargo. Quando alguém sair e ficar faltando, o app avisa que precisa recrutar.</p>'}</div>

  $('#rc-new', pg).onclick = () => editarCandidato(null);
  $('#rc-q', pg).onclick = editarQuadro;
  $$('[data-nv]', pg).forEach(b => b.onclick = e => { e.stopPropagation(); const [loja, cargo] = b.dataset.nv.split('|'); editarCandidato({ loja, cargo }); });

  $$('[data-cv]', pg).forEach(b => b.onclick = e => { e.stopPropagation(); verCandidato(b.dataset.cv); });

/* tela do candidato com o checklist */
function verCandidato(id) {
  const c = Store.get('candidatos', id); if (!c) return;
  const ps = Rec.passos(c), prox = Rec.proximo(c), fim = ['reprovado', 'desistiu'].includes(c.etapa), f = c.funcId ? Func.get(c.funcId) : null;
  const acoes = {
    entrevista: () => c.entrevista && c.entrevista.data && !c.entrevista.resultado ? `<button class="btn sm primary" data-a="res-entrevista">Como foi?</button><button class="btn sm" data-a="msg-entrevista">${ico('wa')} Mensagem</button><button class="btn sm" data-a="ag-entrevista">Remarcar</button>` : !c.entrevista ? `<button class="btn sm primary" data-a="ag-entrevista">Marcar entrevista</button>` : '',
    teste: () => c.teste && c.teste.data && !c.teste.resultado ? `<button class="btn sm primary" data-a="res-teste">Como foi o teste?</button><button class="btn sm" data-a="msg-teste">${ico('wa')} Mensagem</button><button class="btn sm" data-a="ag-teste">Remarcar</button>` : !c.teste && !['aprovado', 'exame', 'contratado'].includes(c.etapa) ? `<button class="btn sm" data-a="ag-teste">Marcar teste</button>` : c.teste && c.teste.valor && !c.teste.pago ? `<button class="btn sm" data-a="pagar-teste">Marcar teste como pago</button>` : '',
    aprovado: () => '',
    exame: () => !['aprovado', 'exame', 'contratado'].includes(c.etapa) ? '' : !c.exame ? `<button class="btn sm primary" data-a="ag-exame">Marcar exame</button>` : !c.exame.feito ? `<button class="btn sm primary" data-a="feito-exame">Exame feito</button><button class="btn sm" data-a="msg-exame">${ico('wa')} Mensagem</button><button class="btn sm" data-a="ag-exame">Remarcar</button>` : '',
    ficha: () => !f && ['aprovado', 'exame', 'contratado'].includes(c.etapa) ? `<button class="btn sm primary" data-a="contratar">Cadastrar funcionário</button>` : f ? `<a class="btn sm" href="#/func/${f.id}">Abrir ficha</a>` : '',
    contrato: () => f ? `<button class="btn sm" data-a="ck-contrato">${(c.check || {}).contrato ? 'Desmarcar' : 'Marcar assinado'}</button><button class="btn sm" data-a="anx-contrato">${ico('clip')} Anexar</button>` : '',
    uniforme: () => f ? `<button class="btn sm" data-a="unif">Entregar uniforme</button>` : '',
    imagem: () => f ? `<button class="btn sm" data-a="pr-imagem">${ico('print')} Imprimir termo</button><button class="btn sm" data-a="ck-imagem">${(c.check || {}).imagem ? 'Desmarcar' : 'Marcar assinado'}</button>` : ''
  };
  const m = modal({ title: esc(c.nome), wide: true, body: `<div class="row"><span class="pill ${ETAPAS[c.etapa][1]}">${ETAPAS[c.etapa][0]}</span><span class="muted">${esc(c.cargo || '')} · ${esc(Lojas.nome(c.loja))}${c.telefone ? ' · ' + esc(c.telefone) : ''}${c.origem ? ' · veio por ' + esc(c.origem) : ''}</span><span class="grow"></span>${c.fuma === 'sim' ? '<span class="pill warn">fuma</span>' : c.fuma === 'nao' ? '<span class="pill ok">não fuma</span>' : '<span class="pill">fuma? não perguntado</span>'}</div>
    ${c.obs ? `<p class="muted small" style="margin:0;white-space:pre-wrap">${esc(c.obs)}</p>` : ''}
    <div class="col" style="gap:0">${ps.map((p, i) => `<div class="row" style="flex-wrap:nowrap;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);${prox && prox.k === p.k ? 'background:#f4fbf6;margin:0 -10px;padding:10px;border-radius:8px' : ''}"><span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700;${p.ok ? 'background:var(--acc);color:#fff' : 'background:#eef0ee;color:var(--mut)'}">${p.ok ? ico('check').replace('<svg', '<svg style="width:14px;height:14px"') : i + 1}</span><div class="grow"><b>${p.t}</b>${p.pulado ? ' <span class="muted small">(sem teste)</span>' : ''}${prox && prox.k === p.k && !fim ? ' <span class="pill info">próximo passo</span>' : ''}${p.info ? `<br><span class="small muted">${esc(p.info)}</span>` : ''}</div><div class="row" style="justify-content:flex-end">${fim ? '' : acoes[p.k]()}</div></div>`).join('')}</div>
    ${fim ? `<div class="alert bad">Processo encerrado: ${ETAPAS[c.etapa][0]}. <button class="btn sm" data-a="reabrir" style="margin-left:auto">Reabrir</button></div>` : ''}`,
    foot: `<button class="btn danger" data-a="del" style="margin-right:auto">Excluir</button>${!fim && c.etapa !== 'contratado' ? '<button class="btn" data-a="desistiu">Desistiu</button>' : ''}<button class="btn" data-a="editar">${ico('edit')} Editar dados</button><button class="btn" data-x>Fechar</button>` });
  const re = () => { m.close(); verCandidato(id); };

const hm = v => { /* aceita "2:30", "2,5", "2h30" → horas decimais */

  doMes(mes) { return Store.all('ponto').filter(p => p.mes === mes); },

/* escala atual da equipe (pré-cadastro): nome → turno */
const ESCALA_PADRAO = { manha: ['leonardo', 'anderson', 'gonzalo'], manha1010: ['laiane'], noite: ['denize', 'kelli', 'regian', 'ruan', 'luciano', 'guilherme', 'weslen', 'emily', 'emilly', 'robson', 'rafael', 'fabiana'] };
function sugestaoTurno(f) {
  const ts = Store.cfg().turnos || [], partes = norm(f.nome).split(/\s+/), primeiro = partes[0];
  const achar = teste => Object.entries(ESCALA_PADRAO).find(([id, nomes]) => ts.some(t => t.id === id) && nomes.some(teste));
  const r = achar(n => n === primeiro) || achar(n => partes.includes(n));

}

/* regras de segurança do Firebase geradas com os e-mails da gestão */
function gestoresLista() {
  const l = (Store.cfg().gestores || []).map(e => String(e).trim().toLowerCase()).filter(Boolean);
  const eu = Store.user && Store.user.email && Store.user.email.includes('@') ? Store.user.email.toLowerCase() : '';
  if (eu && !l.includes(eu)) l.unshift(eu); return l;
}
function regrasFirestore(emails) {
  return `rules_version = '2';
// DP X + Ponto X · Xis da Gaúcha · gerado em ${D.fmt(D.hoje())}
service cloud.firestore {
  match /databases/{database}/documents {
    function logado() { return request.auth != null; }
    function gestao() { return logado() && request.auth.token.email in [${emails.map(e => `'${e}'`).join(', ')}]; }
    function tablet() { return logado() && request.auth.token.email == '${TABLET_EMAIL}'; }

    // Tudo do DP X: só a gestão
    match /{doc=**} { allow read, write: if gestao(); }

    // Minha área: cada funcionário vê só o próprio resumo
    match /portal/{uid} {
      allow read: if logado() && request.auth.uid == uid;
      allow update: if logado() && request.auth.uid == uid
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['senhaTrocadaEm']);
    }

    // Ponto X: o tablet só vê a lista de nomes e só cria batidas com o horário do servidor
    match /pontoPin/{id} { allow read: if tablet(); }
    match /batidas/{id} {
      allow create: if tablet()
        && request.resource.data.at == request.time
        && request.resource.data.origem == 'tablet'
        && request.resource.data.keys().hasOnly(['funcId', 'nome', 'loja', 'at', 'atLocal', 'disp', 'origem', 'foto', 'rosto', 'dist', 'liberado', 'v'])
        && exists(/databases/$(database)/documents/pontoPin/$(request.resource.data.funcId));
    }
    match /batidaFotos/{id} {
      allow create: if tablet() && request.resource.data.at == request.time
        && request.resource.data.img is string && request.resource.data.img.size() < 200000;
    }
    match /tablets/{id} { allow read, write: if tablet(); }
  }
}`;
}
function regrasStorage(emails) {
  return `rules_version = '2';
// DP X · Xis da Gaúcha · gerado em ${D.fmt(D.hoje())}
service firebase.storage {
  match /b/{bucket}/o {
    match /{all=**} {
      allow read, write: if request.auth != null && request.auth.token.email in [${emails.map(e => `'${e}'`).join(', ')}];

}`;
}

/* reconhecimento facial (mesmo código no DP X e no Ponto X) */
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js';
const FACE_MODELOS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const Rosto = {
  estado: 'off', erro: null, _p: null, LIMITE: 0.55,
  carregar() {
    if (this._p) return this._p;
    this.estado = 'carregando';
    const p = new Promise((res, rej) => { if (window.faceapi) return res(); const s = document.createElement('script'); s.src = FACE_LIB; s.async = true; s.onload = () => res(); s.onerror = () => rej(new Error('Não consegui baixar o reconhecimento facial')); document.head.appendChild(s); })
      .then(async () => {
        if (faceapi.tf && faceapi.tf.ready) await faceapi.tf.ready();
        const n = faceapi.nets; await n.tinyFaceDetector.load(FACE_MODELOS); await n.faceLandmark68Net.load(FACE_MODELOS); await n.faceRecognitionNet.load(FACE_MODELOS);
        this.estado = 'pronto';
      });
    this._p = p.catch(e => { this.estado = 'erro'; this.erro = e; this._p = null; throw e; });
    return this._p;
  },
  /* 128 números que descrevem o rosto, ou null se não achou rosto */
  async descritor(canvas) {
    const r = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 })).withFaceLandmarks().withFaceDescriptor();
    return r ? Array.from(r.descriptor) : null;
  },
  distancia(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); },
  /* quadro inteiro da câmera, espelhado (igual ao que a pessoa vê) */
  quadro(v) { const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0); return c; },
  /* recorte 3x4 em JPEG; com carimbo de data/hora quando recebe as linhas */
  recorte(q, w, h, linhas, qual = 0.66) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    const alvo = w / h; let sw = q.width, sh = q.height, sx = 0, sy = 0;
    if (q.width / q.height > alvo) { sw = q.height * alvo; sx = (q.width - sw) / 2; } else { sh = q.width / alvo; sy = (q.height - sh) / 2; }
    g.drawImage(q, sx, sy, sw, sh, 0, 0, w, h);
    if (linhas) {
      g.fillStyle = 'rgba(0,0,0,.62)'; g.fillRect(0, h - 64, w, 64); g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
      const caber = (t, px, bold) => { let s = px; do { g.font = `${bold ? 'bold ' : ''}${s}px system-ui, Arial, sans-serif`; s--; } while (g.measureText(t).width > w - 20 && s > 9); };
      caber(linhas[0], 24, true); g.fillText(linhas[0], 10, h - 36);
      caber(linhas[1], 14, false); g.fillText(linhas[1], 10, h - 14);
    }
    return c.toDataURL('image/jpeg', qual);

/* horário da ficha ("17:05 às 01:00"); no domingo usa o "Horário no domingo", se tiver */
const hIni = t => { const m = String(t || '').match(/(\d{1,2})[:h](\d{2})/); return m ? pad2(+m[1]) + ':' + m[2] : ''; };
const hFim = t => { const m = String(t || '').match(/\d{1,2}[:h]\d{2}/g); return m && m.length > 1 ? hIni(m[m.length - 1]) : ''; };
const ehDomingo = dia => !!dia && D.parse(dia).getDay() === 0;
const turnoDe = f => f && f.turno ? (Store.cfg().turnos || []).find(t => t.id === f.turno) || null : null;
function horarioBase(f) { const t = turnoDe(f); return String((t ? t.horario : f && f.horario) || ''); }
function horarioDo(f, dia) { return String((ehDomingo(dia) ? (f.horarioDom || Store.cfg().pontoDomHorario) : horarioBase(f)) || ''); }
function horaIni(f, dia) { return hIni(horarioDo(f || {}, dia)); }
function horaFim(f, dia) { return hFim(horarioDo(f || {}, dia)); }
/* minutos de atraso da primeira batida do dia (null se não chegou atrasado) */
/* batida fora do horário do dia (antes da liberação ou mais de 10 min depois da saída) */
function foraDoHorario(f, dia, t) {
  const a0 = horaIni(f, dia), b0 = horaFim(f, dia); if (!a0 || !b0) return false;
  const v = Bat.virada(), dt = hm => { const [h, m] = hm.split(':').map(Number), d = D.parse(dia); d.setHours(h, m, 0, 0); if (h < v) d.setDate(d.getDate() + 1); return +d; };
  const a = dt(a0); let b = dt(b0); if (b <= a) b += 86400000;
  const antes = Math.max(5, +Store.cfg().pontoAntecedencia || 0) * 60000;
  return t < a - antes || t > b + 10 * 60000;
}
function atrasoDe(f, dia, primeira) {
  const ini = horaIni(f, dia); if (!ini || !primeira) return null;
  const [h, m] = ini.split(':').map(Number), esp = D.parse(dia); esp.setHours(h, m, 0, 0);
  const min = Math.round((primeira - esp) / 60000);
  const fimH = horaFim(f, dia); let lim = 600;
  if (fimH) { const [h2, m2] = fimH.split(':').map(Number), fim = D.parse(dia); fim.setHours(h2, m2, 0, 0); if (+fim <= +esp) fim.setDate(fim.getDate() + 1); lim = (fim - esp) / 60000; }
  return min > Bat.atrasoMin() && min < lim ? min : null;
}
/* batidas de hoje ao vivo: avisa na tela (e no computador, se liberado) quando alguém chega atrasado */
const PontoHoje = {
  lista: [], unsub: null, avisados: new Set(),
  iniciar() {
    if (Store.mode !== 'live' || this.unsub) return;
    const ini = new Date(); ini.setHours(Bat.virada(), 0, 0, 0); if (Date.now() < +ini) ini.setDate(ini.getDate() - 1);
    let primeiro = true;
    this.unsub = Store.db.collection('batidas').where('at', '>=', firebase.firestore.Timestamp.fromDate(ini)).onSnapshot(s => {
      this.lista = []; s.forEach(d => { const x = d.data(); this.lista.push(Object.assign({}, x, { id: d.id, at: x.at && x.at.toMillis ? x.at.toMillis() : x.atLocal })); });
      const novos = primeiro ? [] : s.docChanges().filter(c => c.type === 'added').map(c => c.doc.id); primeiro = false;
      this.atrasos().forEach(a => { if (novos.includes(a.b.id) && !this.avisados.has(a.b.id)) { this.avisados.add(a.b.id); this.avisar(a); } });
      if (S.view === 'inicio') App.render(true);
    }, () => {});
    setTimeout(() => { if (this.unsub) { this.unsub(); this.unsub = null; this.iniciar(); } }, 6 * 3600e3); /* troca de dia */
  },
  /* primeira batida de hoje de cada um, com atraso */
  atrasos() {
    const dia = Bat.dia(Date.now()), out = [], por = {};
    this.lista.filter(b => !b.desconsiderada && Bat.dia(b.at) === dia).sort((a, b) => a.at - b.at).forEach(b => { if (!por[b.funcId]) por[b.funcId] = b; });
    Object.values(por).forEach(b => { const f = Func.get(b.funcId); const min = f && atrasoDe(f, dia, b.at); if (min) out.push({ f, b, min }); });
    return out.sort((a, b) => a.b.at - b.b.at);
  },
  presentes() { const dia = Bat.dia(Date.now()), c = {}; this.lista.filter(b => !b.desconsiderada && Bat.dia(b.at) === dia).forEach(b => c[b.funcId] = (c[b.funcId] || 0) + 1); return Object.entries(c).filter(([, n]) => n % 2 === 1).map(([id]) => Func.get(id)).filter(Boolean); },
  avisar(a) {
    const txt = `${a.f.nome.split(' ')[0]} chegou ${a.min} min atrasado(a) · ${hhmmT(a.b.at)} (entrada ${horaIni(a.f, Bat.dia(a.b.at))})`;
    toast('⏰ ' + txt, 'bad');
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Atraso no ponto', { body: txt, icon: 'icon-192.png' }); } catch (e) { }
  }
};

}

    ${F('Outro motivo', 'outro', '', { ph: 'Escreva se não estiver na lista' })}
    ${F('Descrição do ocorrido (sai no documento)', 'descricao', '', { type: 'area', ph: 'Conte o que aconteceu: horário, onde, quem viu…' })}

    <p class="muted small" style="margin:0">As testemunhas assinam se o funcionário se recusar a assinar.</p>`,
    foot: '<button class="btn" data-x>Cancelar</button><button class="btn" id="na-sv">Só salvar</button><button class="btn primary" id="na-ok">' + ico('print') + ' Salvar e imprimir</button>' });

  const desc = () => { if (descEdit) return; const t = [...motivos].map(id => c.motivosAdv.find(x => x.id === id)?.texto).filter(Boolean); const o = $('[data-k=outro]', m.el).value.trim(); if (o) t.push(o); const d = $('[data-k=dataFato]', m.el).value; $('[data-k=descricao]', m.el).value = t.length ? `No dia ${D.fmt(d)}, o(a) funcionário(a) ${t.join('; ')}.` : ''; };
  const sus = () => { const ds = Math.max(1, +$('[data-k=dias]', m.el).value || 1), i = $('[data-k=inicio]', m.el).value; if (i) $('[data-k=retorno]', m.el).value = D.add(i, ds); };
  hist(); desc();
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-tp]'); if (!b) return; tipo = b.dataset.tp; $$('[data-tp]', m.el).forEach(x => x.classList.toggle('on', x === b)); $('#na-sus', m.el).hidden = tipo !== 'suspensao'; });

      <p class="small" style="margin:0">Link: <b>${esc(location.href.replace(/[#?].*$/, '').replace(/index\.html$/, '').replace(/\/?$/, '/'))}ponto.html</b></p>
      <div class="fgrid">${F('Jornada por dia (padrão)', 'pontoJornada', c.pontoJornada, { ph: '7:20' })}${F('Intervalo pré-assinalado (min)', 'pontoIntervalo', c.pontoIntervalo, { type: 'number' })}${F('Tolerância por dia (min)', 'pontoTolerancia', c.pontoTolerancia, { type: 'number' })}${F('O dia de trabalho vira às (hora)', 'pontoVirada', c.pontoVirada, { type: 'number' })}</div>
      <label class="check"><input type="checkbox" data-k="pontoBloquearAntes" ${c.pontoBloquearAntes !== false ? 'checked' : ''}><span><b>Não deixar bater o ponto muito antes do horário</b> de entrada que está na ficha de cada um (campo Horário). Ex.: entrada 17:05 e 5 min → libera a partir das 17:00.</span></label>
      <div class="sec" style="margin:6px 0 0">Turnos (para escolher na ficha de cada um)</div>
      <div id="cf-tu" class="col" style="gap:6px">${(c.turnos || []).map((t, i) => `<div class="row" style="flex-wrap:nowrap"><input class="input" data-tn="${i}" value="${esc(t.nome)}" placeholder="Nome do turno" style="max-width:200px"><input class="input" data-th="${i}" value="${esc(t.horario)}" placeholder="09:00 às 17:20" style="max-width:180px"><input class="input num" type="number" data-ti="${i}" value="${t.intervalo ?? 60}" style="width:90px" title="Intervalo (min)"><span class="muted small">min de intervalo</span><button class="btn sm ghost" data-tx="${i}">×</button></div>`).join('')}</div>
      <div class="row"><button class="btn sm" id="cf-tadd">${ico('plus')} Turno</button><button class="btn sm" id="cf-heq">${ico('users')} Escolher o turno de cada um</button></div>
      <div class="fgrid">${F('Domingo: horário de todos', 'pontoDomHorario', c.pontoDomHorario ?? '18:00 às 00:45', { ph: '18:00 às 00:45' })}${F('Domingo: intervalo (min)', 'pontoDomIntervalo', c.pontoDomIntervalo ?? 15, { type: 'number' })}</div>
      <div class="fgrid">${F('Libera quantos min antes da entrada', 'pontoAntecedencia', c.pontoAntecedencia ?? 5, { type: 'number' })}${F('Atraso: conta depois de quantos min', 'pontoAtraso', c.pontoAtraso ?? 5, { type: 'number' })}</div>
      <label class="check"><input type="checkbox" data-k="pontoPedirPin" ${c.pontoPedirPin === true ? 'checked' : ''}><span><b>Pedir PIN</b> no tablet. Desmarcado: a pessoa toca no nome e o tablet tira a selfie direto — a foto é o que confirma quem bateu.</span></label>
      <label class="check"><input type="checkbox" data-k="portalPonto" ${c.portalPonto !== false ? 'checked' : ''}><span>Mostrar o <b>ponto</b> (horas extras, faltantes, faltas) para o funcionário na <b>Minha área</b></span></label>
      <label class="check"><input type="checkbox" data-k="pontoNoturna" ${c.pontoNoturna !== false ? 'checked' : ''}><span>Contar a <b>hora noturna reduzida</b>: entre 22h e 5h, cada 52min30s vale 1 hora (CLT, art. 73)</span></label>
      <p class="muted small" style="margin:0">Jornada e intervalo podem ser diferentes para cada pessoa, na ficha. O intervalo só é descontado quando a pessoa bate apenas entrada e saída e trabalhou mais de 6h. Batidas antes da hora da virada contam para o dia anterior (turno até 01:00).</p></div>
    <div class="card col"><h2>Segurança do Firebase</h2>
      <p class="muted small" style="margin:0">Estas regras deixam o DP X só para a gestão, cada funcionário vendo só a própria Minha área, e o tablet só registrando o ponto. Coloque aqui o e-mail de <b>todo mundo que entra no DP X</b> — quem não estiver na lista fica sem acesso.</p>
      ${F('E-mails da gestão (um por linha)', 'gestoresTxt', gestoresLista().join('\n'), { type: 'area', attrs: 'style="min-height:70px" autocapitalize="off"' })}
      <div class="row"><button class="btn sm primary" id="rg-fs">Copiar regras do Firestore</button><button class="btn sm" id="rg-st">Copiar regras do Storage</button></div>
      <p class="muted small" style="margin:0">No Firebase do DP X: <b>Firestore Database → Regras</b>, apague tudo, cole e clique em <b>Publicar</b>. Depois <b>Storage → Regras</b>, a mesma coisa com a segunda. Salve esta tela antes, se mudar os e-mails.</p></div>
    <div class="card col"><h2>Pedido X e Minha área</h2>${Store.mode === 'demo' ? '<p class="muted" style="margin:0">Disponível no sistema publicado.</p>' : PX.ligado() ? `<div class="row"><span class="pill ok">ligado</span><span class="muted small grow">${esc(PX.user.email)}${PX.ultimo ? ' · atualizado ' + fmtDT(PX.ultimo) : ''}${PX.erro ? ' · erro: ' + esc(PX.erro) : ''}</span><button class="btn sm" id="px-sync">${ico('refresh')} Atualizar agora</button><button class="btn sm danger" id="px-out">Desligar</button></div>` : `<div class="row"><span class="pill">não ligado</span><span class="muted small grow">Ligue para a Minha área mostrar consumo e voucher, e para quem for desligado sumir do caixa.</span><button class="btn sm primary" id="px-in">${ico('link')} Ligar ao Pedido X</button></div>`}
      <p class="muted small" style="margin:0">Link da Minha área para os funcionários: <b>${esc(location.href.replace(/[#?].*$/, '').replace(/index\.html$/, '').replace(/\/?$/, '/'))}minha-area.html</b>. O acesso de cada um é criado na ficha (botão "Criar acesso à Minha área").</p></div>
    <div class="card"><h2>Acesso</h2><p class="muted" style="margin:6px 0 0">Quem entra no DP X é criado no Firebase deste app, em <b>Authentication → Usuários → Adicionar usuário</b>. Crie só para a gestão (você e o Tiago).</p></div></div>`;
  const ler = () => {
    const o = JSON.parse(JSON.stringify(c)); $$('[data-k]', pg).forEach(i => { if (i.dataset.k === 'cargosTxt') o.cargos = i.value.split('\n').map(s => s.trim()).filter(Boolean); else if (i.dataset.k === 'gestoresTxt') o.gestores = i.value.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(x => x.includes('@')); else setDeep(o, i.dataset.k, i.type === 'checkbox' ? i.checked : i.value.trim()); });
    o.exp1 = +o.exp1 || 30; o.exp2 = +o.exp2 || 60; o.avisoDias = Math.max(0, +o.avisoDias || 0); ['valorTeste', 'valorExameAdm', 'valorExameDem'].forEach(k => o[k] = num(o[k])); o.diasTeste = Math.max(1, +o.diasTeste || 3);
    o.pontoJornada = o.pontoJornada || '7:20'; o.pontoIntervalo = Math.max(0, +o.pontoIntervalo || 0); o.pontoTolerancia = Math.max(0, Math.min(10, +o.pontoTolerancia || 0)); o.pontoVirada = Math.max(0, Math.min(10, +o.pontoVirada || 0)); o.pontoAntecedencia = Math.max(0, Math.min(120, +o.pontoAntecedencia || 0)); o.pontoDomIntervalo = Math.max(0, Math.min(120, +o.pontoDomIntervalo || 0)); o.pontoAtraso = Math.max(0, Math.min(60, +o.pontoAtraso || 0));
    o.feriadosLocais = $$('[data-fd]', pg).map(i => { const n = +i.dataset.fd, [dd, mm] = i.value.split('/').map(s => s.trim()); return { md: dd && mm ? `${pad2(+mm)}-${pad2(+dd)}` : '', nome: $(`[data-fn="${n}"]`, pg).value.trim(), loja: $(`[data-fl="${n}"]`, pg).value }; }).filter(h => h.nome);
    o.turnos = $$('[data-tn]', pg).map(i => { const n = +i.dataset.tn, ant = (c.turnos || [])[n]; return { id: ant ? ant.id : uid(), nome: i.value.trim(), horario: $(`[data-th="${n}"]`, pg).value.trim(), intervalo: Math.max(0, +$(`[data-ti="${n}"]`, pg).value || 0) }; }).filter(t => t.nome && t.horario);
    o.motivosAdv = $$('[data-mn]', pg).map(i => { const n = +i.dataset.mn, ant = c.motivosAdv[n]; return { id: ant ? ant.id : uid(), nome: i.value.trim(), texto: $(`[data-mt="${n}"]`, pg).value.trim() }; }).filter(x => x.nome);
    return o;
  };
  const on2 = (id, fn) => { const e = $(id, pg); if (e) e.onclick = fn; }; on2('#px-in', () => PX.ligar()); on2('#tb-ac', () => acessoTablet());
  on2('#tb-lk', () => copiarTexto(location.href.replace(/[#?].*$/, '').replace(/index\.html$/, '').replace(/\/?$/, '/') + 'ponto.html', 'Link do tablet copiado'));
  const emailsForm = () => { const v = $('[data-k=gestoresTxt]', pg).value.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(x => x.includes('@')); const eu = (Store.user && Store.user.email || '').toLowerCase(); if (eu.includes('@') && !v.includes(eu)) v.unshift(eu); return v; };
  on2('#rg-fs', () => copiarTexto(regrasFirestore(emailsForm()), 'Regras do Firestore copiadas'));
  on2('#rg-st', () => copiarTexto(regrasStorage(emailsForm()), 'Regras do Storage copiadas')); on2('#px-sync', () => PX.sync(true)); on2('#px-out', () => PX.sair());
  $('#cf-sv', pg).onclick = async () => { const o = ler(); if (o.exp1 + o.exp2 > 90) return toast('O contrato de experiência não pode passar de 90 dias', 'bad'); await Store.setCfg(o); toast('Configurações salvas'); };
  $('#cf-fadd', pg).onclick = () => { Store.cfgDoc = Object.assign(ler(), { feriadosLocais: [...ler().feriadosLocais, { md: '', nome: ' ', loja: '' }] }); App.render(); };
  $('#cf-tadd', pg).onclick = () => { const o = ler(); o.turnos.push({ id: uid(), nome: 'Novo turno', horario: '17:05 às 01:00', intervalo: 60 }); Store.cfgDoc = o; App.render(); };
  $$('[data-tx]', pg).forEach(b => b.onclick = () => { const o = ler(); o.turnos.splice(+b.dataset.tx, 1); Store.cfgDoc = o; App.render(); });
  $('#cf-heq', pg).onclick = async () => { await Store.setCfg(ler()); horariosEquipe(); };
  $('#cf-madd', pg).onclick = () => { const o = ler(); o.motivosAdv.push({ id: uid(), nome: 'Novo motivo', texto: '' }); Store.cfgDoc = o; App.render(); };
  $$('[data-fx]', pg).forEach(b => b.onclick = () => { const o = ler(); o.feriadosLocais.splice(+b.dataset.fx, 1); Store.cfgDoc = o; App.render(); });
  $$('[data-mx]', pg).forEach(b => b.onclick = () => { const o = ler(); o.motivosAdv.splice(+b.dataset.mx, 1); Store.cfgDoc = o; App.render(); });
}
