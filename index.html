<title>DP X · Xis da Gaúcha</title><style>:root{--bg:#f3f4f2;--card:#fff;--ink:#121614;--mut:#66706a;--line:#e3e6e2;--acc:#1f8a4c;--acc2:#25d366;--accbg:#e4f4ea;--bad:#c62828;--badbg:#fdecec;--warn:#a86b00;--warnbg:#fff4dc;--info:#1f5fa8;--infobg:#e6eefa;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}
.muted{color:var(--mut)}.small{font-size:13px}.r{text-align:right}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.grow{flex:1}
.shell{display:flex;min-height:100vh}
.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.mark{width:40px;height:40px;border-radius:10px;background:#0e1310;display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand b{display:block;font-size:18px}.brand small{display:block;font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;cursor:pointer;text-align:left;color:#3b4540;font-weight:500}
.nav:hover{background:#f1f3f0}.nav.on{background:var(--accbg);color:var(--acc);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.main{flex:1;padding:24px 28px 60px;min-width:0;max-width:1200px}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}.head .sub{color:var(--mut);margin-top:4px}.head>.grow{min-width:220px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#c9cfca}.btn svg{width:16px;height:16px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:#1a7a43}
.btn.danger{color:var(--bad);border-color:#f0c4c4}.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.input{width:100%;border:1px solid #d6dbd7;border-radius:9px;padding:8px 11px;background:#fff;min-height:38px}
.input:focus{outline:2px solid #bfe6cd;border-color:var(--acc)}
textarea.input{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field>span{font-size:12px;font-weight:600;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fgrid .w2{grid-column:span 2}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:#eef0ee;color:#3b4540;white-space:nowrap}
.pill.ok{background:var(--accbg);color:var(--acc)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.table th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;background:#f7f8f6;border-bottom:1px solid var(--line)}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}.table tr.click{cursor:pointer}.table tr.click:hover td{background:#fafbfa}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}.kpi .l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.kpi .v{font-size:26px;font-weight:700;display:block;margin-top:4px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--warnbg);border:1px solid #f1d9a4;flex-wrap:wrap}
.alert.bad{background:var(--badbg);border-color:#f3c5c5}.alert.info{background:var(--infobg);border-color:#c9d9f1}
.empty{padding:28px;text-align:center;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
.list .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.k-ferias{background:#0e9f6e}.k-aniv{background:#d6338a}.k-empresa{background:#7b4bc7}.k-contrato{background:#d98a00}.k-pagto{background:#1f8a4c}.k-feriado{background:#c62828}.k-agenda{background:#1f6fd1}.k-exame{background:#0e8f8f}.k-adv{background:#555}.k-entrevista{background:#b5530a}.k-teste{background:#5a6b10}.k-vaga{background:#c62828}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.cal .dh{padding:8px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;background:#f7f8f6;border-bottom:1px solid var(--line);text-align:center}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative}
.cal .d:nth-child(7n){border-right:0}.cal .d.out{background:#fafbfa;color:#aab1ac}.cal .d.today .n{background:var(--acc);color:#fff;border-radius:50%}
.cal .d:hover{background:#f7faf8}
.cal .n{font-size:12px;font-weight:700;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{font-size:11.5px;line-height:1.25;padding:2px 5px;border-radius:5px;margin-top:3px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .more{font-size:11px;color:var(--mut);margin-top:2px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg span{display:inline-flex;gap:5px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal.wide{max-width:860px}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.modal .mh h2{flex:1}
.modal .mb{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#121614;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.check:has(input:checked){border-color:var(--acc);background:#f4fbf6}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc)}
.files{display:flex;flex-direction:column;gap:6px}.files .f{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:380px}
.hist .h{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}.hist .h:last-child{border:0}
.demo{background:#121614;color:#cfe;padding:6px 14px;font-size:12px;display:flex;gap:10px;align-items:center}.demo b{color:var(--acc2)}.demo .btn{color:#121614}
.mbar{display:none}
@media (max-width:820px){
  .shell{flex-direction:column}.side{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand,.side .sp,.side .ft{display:none}.nav{flex-direction:column;gap:3px;font-size:11px;padding:6px 8px;min-width:70px;align-items:center}
  .main{padding:16px 14px 60px}.fgrid .w2{grid-column:auto}
  .cal .d{min-height:64px;padding:3px}.cal .ev{font-size:0;height:6px;padding:0;margin-top:2px}
  .table{display:block;overflow-x:auto}
}
.table a{color:var(--ink)}.table a:hover{color:var(--acc)}
a.btn{color:var(--ink);text-decoration:none}
.pv-ov{position:fixed;inset:0;z-index:80;background:#e9ece9;display:flex;flex-direction:column}.pv-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#121614;color:#fff}.pv-bar .btn:not(.primary){color:var(--ink)}.pv-fr{flex:1;border:0;width:100%;background:#e9ece9}
</style></head>
